// 「今日」「1日前」「N日前」の判定は、経過ミリ秒ではなくローカルの暦日の差分で行う
// （例：昨日23:58にバックアップし今日0:02に開いた場合、経過時間は4分でも「1日前」と
// 表示する方が直感に合うため）。
// 🆕 バックアップ未実施の警告を段階的に強化：経過日数が伸びるほど、文言・トーンの
// 両方を3段階（ok→stale→overdue）で強めていく。しきい値は他ツールの通知間隔等を
// 踏まえたおおよその目安（7日＝約1週間放置／30日＝約1ヶ月放置）。
function lastExportReminderState(iso) {
  const then = new Date(iso);
  if (isNaN(then.getTime())) return null;
  const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diffDays = Math.round((startOfDay(new Date()) - startOfDay(then)) / 86400000);
  if (diffDays <= 0) return { tier: 'ok', label: t('dyn.lastExportToday') };
  if (diffDays === 1) return { tier: 'ok', label: t('dyn.lastExportYesterday') };
  if (diffDays >= 30) return { tier: 'overdue', label: t('dyn.lastExportOverdue', { n: diffDays }) };
  if (diffDays >= 7) return { tier: 'stale', label: t('dyn.lastExportStale', { n: diffDays }) };
  return { tier: 'ok', label: t('dyn.lastExportDaysAgo', { n: diffDays }) };
}

function renderLastExportReminder() {
  const el = document.getElementById('lastExportReminder');
  if (!el) return;
  const iso = getLastExportAt();
  const state = iso ? lastExportReminderState(iso) : null;
  if (!state) {
    el.className = 'last-export-reminder never';
    el.textContent = t('dyn.lastExportNever');
    return;
  }
  el.className = 'last-export-reminder' + (state.tier === 'ok' ? '' : ' ' + state.tier);
  el.textContent = state.label;
}

/* ================================================================
   🕒 直近の書き出し/読込履歴ログ
   上の「最終バックアップ」リマインダー（日時1件のみ）を土台に、直近5件分の
   書き出し/読込イベントを、それぞれの対象サイト一覧つきで記録する。このツール
   自身の内部管理用キー（SITE_SNAPSHOT_KEY・LAST_EXPORT_KEYと同じ理由で引き継ぎの
   対象キーには含めない＝SITE_CATALOGのどのsite.keysにもマッチしない専用
   プレフィックスを使う）。
   ================================================================ */
const TRANSFER_HISTORY_KEY = 'dataTransferHistory_v1'; // [{ type:'export'|'import', at:ISO日時, siteIds:[可視サイトid,...], hiddenCount:非公開サイト件数 }, ...] 新しい順
const TRANSFER_HISTORY_MAX = 5;
let transferHistoryOpen = false;

function loadTransferHistory() {
  try {
    const v = JSON.parse(localStorage.getItem(TRANSFER_HISTORY_KEY));
    return Array.isArray(v) ? v : [];
  } catch (e) { return []; }
}
// siteIdsは可視サイト（SITE_CATALOGのhidden:trueでないもの）のみを渡す想定。非公開サイトは
// 名前を記録に残さず、hiddenCountの件数としてのみ記録する（既存のoverwriteHiddenNote等と
// 同じマスキング方針）。
function recordTransferHistoryEntry(type, siteIds, hiddenCount) {
  try {
    const list = loadTransferHistory();
    list.unshift({ type, at: new Date().toISOString(), siteIds: (siteIds || []).slice(), hiddenCount: hiddenCount || 0 });
    localStorage.setItem(TRANSFER_HISTORY_KEY, JSON.stringify(list.slice(0, TRANSFER_HISTORY_MAX)));
  } catch (e) { /* 保存領域上限等は無視して本来の書き出し/読込処理は継続する */ }
}

function toggleTransferHistory() {
  transferHistoryOpen = !transferHistoryOpen;
  renderTransferHistory();
}

function renderTransferHistory() {
  const toggleBtn = document.getElementById('transferHistoryToggleBtn');
  const areaEl = document.getElementById('transferHistoryArea');
  if (!toggleBtn || !areaEl) return;
  const history = loadTransferHistory();
  // 履歴が1件も無い場合は、押しても何も出ないトグルボタン自体を表示しない
  toggleBtn.style.display = history.length > 0 ? '' : 'none';
  toggleBtn.textContent = transferHistoryOpen ? t('dyn.hideHistoryBtn') : t('dyn.showHistoryBtn');
  if (!transferHistoryOpen || history.length === 0) { areaEl.innerHTML = ''; return; }

  areaEl.innerHTML = '<div class="transfer-history-list">' + history.map(entry => {
    const icon = entry.type === 'export' ? '📤' : '📥';
    const dateLabel = siteUpdatedAtLabel(entry.at);
    const siteNames = (entry.siteIds || []).map(id => {
      const site = SITE_CATALOG.find(s => s.id === id);
      return site ? siteLabel(site) : id;
    });
    const joiner = LANG === 'en' ? ', ' : '、';
    let sitesText = siteNames.join(joiner);
    if (entry.hiddenCount > 0) {
      const hiddenNote = t('dyn.historyHiddenNote', { n: entry.hiddenCount });
      sitesText = sitesText ? sitesText + joiner + hiddenNote : hiddenNote;
    }
    if (!sitesText) sitesText = t('dyn.historyNoSites');
    const rowLabelKey = entry.type === 'export' ? 'dyn.historyExportRowLabel' : 'dyn.historyImportRowLabel';
    const ariaLabel = t(rowLabelKey, { date: dateLabel, sites: sitesText });
    return `<div class="transfer-history-row" aria-label="${escapeHtml(ariaLabel)}">
      <span class="transfer-history-icon" aria-hidden="true">${icon}</span>
      <span class="transfer-history-date">${escapeHtml(dateLabel)}</span>
      <span class="transfer-history-sites">${escapeHtml(sitesText)}</span>
    </div>`;
  }).join('') + '</div>';
}

/* ================================================================
   コードの圧縮/展開 + Base64（UTF-8セーフ）
   「コードが長すぎる」というフィードバックを受けて、JSON文字列をgzip圧縮
   （CompressionStream、外部ライブラリ不要）してからBase64化し、コードの
   文字数を大幅に短縮している。未対応ブラウザでは無圧縮（U1:）にフォール
   バックする。「:」はBase64に現れない文字なので、旧形式（無印コード）とも
   衝突せず判別できる。
   ================================================================ */
function bytesToBase64(bytes) {
  let binString = '';
  const CHUNK = 8192;
  for (let i = 0; i < bytes.length; i += CHUNK) {
    binString += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  }
  return btoa(binString);
}
function base64ToBytes(b64) {
  const binString = atob(b64);
  const bytes = new Uint8Array(binString.length);
  for (let i = 0; i < binString.length; i++) bytes[i] = binString.charCodeAt(i);
  return bytes;
}
async function encodeTransferCode(str) {
  const bytes = new TextEncoder().encode(str);
  if (typeof CompressionStream === 'undefined') {
    return 'U1:' + bytesToBase64(bytes);
  }
  const cs = new CompressionStream('gzip');
  const writer = cs.writable.getWriter();
  // ⚠️ write()/close()の返り値はここでは待たず、後続のarrayBuffer()側の失敗として
  // まとめて拾う設計だが、それでもこの2つのPromiseが拒否されると「拾われなかった
  // Promise」として不要なコンソールエラーになるため、無害な.catch()で握りつぶす
  // （実際のエラー内容はarrayBuffer()側の拒否から取得できるため、ここでは不要）。
  writer.write(bytes).catch(() => {});
  writer.close().catch(() => {});
  const compressed = new Uint8Array(await new Response(cs.readable).arrayBuffer());
  return 'G1:' + bytesToBase64(compressed);
}
async function decodeTransferCode(code) {
  const marker = code.slice(0, 3);
  const body = code.slice(3);
  if (marker === 'G1:') {
    const ds = new DecompressionStream('gzip');
    const writer = ds.writable.getWriter();
    // ⚠️ 壊れた/正しくないコードを読み込んだ場合、write()/close()もarrayBuffer()と
    // 同じ理由で拒否されるが、ここでは待たずに無害な.catch()で握りつぶす（拾われな
    // かったPromiseの拒否として不要なコンソールエラーになるのを防ぐため。ユーザーへの
    // エラー表示は、下のawait arrayBuffer()の拒否を呼び出し元がcatchして行う）。
    writer.write(base64ToBytes(body)).catch(() => {});
    writer.close().catch(() => {});
    const bytes = new Uint8Array(await new Response(ds.readable).arrayBuffer());
    return new TextDecoder().decode(bytes);
  }
  if (marker === 'U1:') {
    return new TextDecoder().decode(base64ToBytes(body));
  }
  // 旧形式（圧縮対応前に作成されたコード）: 無印のBase64
  return new TextDecoder().decode(base64ToBytes(code));
}
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ================================================================
   📤 エクスポート（サイト選択 → コード作成）
   ================================================================ */
// 🆕 サイト単位ではなくプロフィール単位での引き継ぎ絞り込み：サイトごとに選択中のプロフィール
// フィルタ（'all'＝従来どおり全プロフィール分／特定のプロフィールIDならそのプロフィールの
// データのみ）。renderExportSiteList()の再描画（言語切替時など）をまたいで選択を保持するため
// モジュールスコープに置く（再描画のたびに初期値'all'へ戻ることを避ける）。
let exportProfileFilters = {};

function renderExportSiteList() {
  const allKeys = getAllLocalStorageKeys();
  const profiles = getLocalProfilesList();
  // 🆕 前回のサイト選択を記憶：直近で実際にコードを作成した際のチェック状態を読み出す。
  // 記録が無い（初回・localStorage不可時）場合は、従来どおり「データがあるサイトを
  // 既定でチェック」にフォールバックする。
  const savedSelection = getLastExportSelection();
  // 🆕 前回バックアップからの変更目印：バックアップが一度もない場合は最上部の
  // .last-export-reminder.neverで既に案内済みのため、ここでは出さない。
  const lastExportAt = getLastExportAt();
  const snapshots = refreshSiteSnapshots();
  const el = document.getElementById('exportSiteList');
  el.innerHTML = SITE_CATALOG.filter(site => !site.hidden).map(site => {
    const matched = matchKeysForSite(site, allKeys);
    const hasData = matched.length > 0;
    const defaultChecked = savedSelection ? savedSelection.includes(site.id) : hasData;
    const changedSinceBackup = !!(hasData && lastExportAt && snapshots[site.id] && snapshots[site.id].updatedAt > lastExportAt);
    // 🆕 同じ端末に複数のプロフィールが登録されている場合のみ、サイトごとの
    // プロフィール絞り込みセレクターを表示する（1件のみ／未登録の場合は従来どおり）。
    const showProfileFilter = site.namespaced && profiles.length > 1;
    const filterVal = showProfileFilter ? (exportProfileFilters[site.id] || 'all') : 'all';
    const filteredMatched = filterVal === 'all' ? matched : matchKeysForSiteProfile(site, allKeys, filterVal);
    const rowHtml = `
      <label class="site-opt ${hasData ? '' : 'no-data'} ${showProfileFilter ? 'has-profile-filter' : ''}" data-site="${site.id}">
        <input type="checkbox" class="site-checkbox" data-site="${site.id}" ${defaultChecked ? 'checked' : ''}>
        <span class="site-opt-label">${escapeHtml(siteLabel(site))}</span>
        <span class="site-opt-changed-badge ${changedSinceBackup ? 'show' : ''}" role="img"
          aria-label="${escapeHtml(t('dyn.changedSinceBackupTitle'))}" title="${escapeHtml(t('dyn.changedSinceBackupTitle'))}">🔄</span>
        <span class="site-opt-count">${t('dyn.keysCount', { n: filteredMatched.length })}</span>
      </label>`;
    const profileRowHtml = showProfileFilter ? `
      <div class="site-opt-profile-row">
        <span aria-hidden="true">👤</span>
        <select class="site-profile-filter" data-site="${site.id}"
          onchange="onExportProfileFilterChange('${site.id}', this.value)"
          aria-label="${escapeHtml(t('page.profileFilterAriaLabel', { site: siteLabel(site) }))}">
          <option value="all" ${filterVal === 'all' ? 'selected' : ''}>${escapeHtml(t('page.allProfilesOption'))} (${t('dyn.keysCount', { n: matched.length })})</option>
          ${profiles.map(p => {
            const cnt = matchKeysForSiteProfile(site, allKeys, p.id).length;
            return `<option value="${escapeHtml(p.id)}" ${filterVal === p.id ? 'selected' : ''}>${escapeHtml(profileDisplayName(p))} (${t('dyn.keysCount', { n: cnt })})</option>`;
          }).join('')}
        </select>
      </div>` : '';
    return rowHtml + profileRowHtml;
  }).join('');
}

// 🆕 サイトごとのプロフィール絞り込みセレクターの変更ハンドラ。チェックボックスの選択状態
// （他サイトも含む）を保ったまま、変更されたサイトの件数表示だけをピンポイントで更新する
// （renderExportSiteList()を丸ごと再実行すると、他サイトのチェック状態まで初期値に
// 戻ってしまうため、意図的に全体再描画を避けている）。
function onExportProfileFilterChange(siteId, value) {
  exportProfileFilters[siteId] = value;
  const site = SITE_CATALOG.find(s => s.id === siteId);
  if (!site) return;
  const allKeys = getAllLocalStorageKeys();
  const filtered = matchKeysForSiteProfile(site, allKeys, value);
  const countEl = document.querySelector(`#exportSiteList label.site-opt[data-site="${siteId}"] .site-opt-count`);
  if (countEl) countEl.textContent = t('dyn.keysCount', { n: filtered.length });
}

// 🆕 前回バックアップからの変更目印を、チェックボックスの選択状態を保ったまま
// 更新する（コード作成直後に呼ぶ。renderExportSiteList()の全体再描画だとチェック
// 状態が既定値に巻き戻ってしまうため、.site-opt-changed-badgeの.showクラスだけを
// 個別に付け替える。バッジ自体は常にDOM上に存在するため要素の作り直しは不要）。
function updateExportChangedBadges() {
  const allKeys = getAllLocalStorageKeys();
  const lastExportAt = getLastExportAt();
  const snapshots = refreshSiteSnapshots();
  SITE_CATALOG.filter(site => !site.hidden).forEach(site => {
    const hasData = matchKeysForSite(site, allKeys).length > 0;
    const changedSinceBackup = !!(hasData && lastExportAt && snapshots[site.id] && snapshots[site.id].updatedAt > lastExportAt);
    const badgeEl = document.querySelector(`#exportSiteList label.site-opt[data-site="${site.id}"] .site-opt-changed-badge`);
    if (badgeEl) badgeEl.classList.toggle('show', changedSinceBackup);
  });
}

let lastExportCode = null;
let lastExportResult = null; // { selectedIds, keyCount, codeLength, compressRate }
let exportTextareaOpen = false;
let exportQrOpen = false;
let exportLinkOpen = false;

// 📤 エクスポート出力（ダウンロード/コピー/リンク/QR）の状態を破棄し、パネルを空にする。
// 新しくコードを作成する直前と、インポートが完了した直後（インポートで書き込んだ
// データが反映されていない古いコードを誤ってダウンロード/コピー/QR表示させない
// ため）の両方から呼び出す。
function resetExportOutput() {
  lastExportCode = null;
  lastExportResult = null;
  exportTextareaOpen = false;
  exportQrOpen = false;
  exportLinkOpen = false;
  const outputEl = document.getElementById('exportOutputArea');
  if (outputEl) outputEl.innerHTML = '';
}

async function generateExportCode() {
  const statusEl = document.getElementById('exportStatus');
  statusEl.className = 'status-msg';
  statusEl.textContent = t('dyn.creatingCode');
  resetExportOutput();

  const allKeys = getAllLocalStorageKeys();
  const selectedIds = [...document.querySelectorAll('#exportSiteList .site-checkbox:checked')].map(el => el.dataset.site);
  // 🌳 hidden:true のサイトはチェックリストに出ないため選択のしようがないが、既存データを
  // 持っていれば下で選択の有無に関わらず常に含めるため、「選択0件」エラーの判定にも
  // それを反映する（confirmImport()側のhasHiddenDataと同じ扱い）。
  const hiddenExportSites = SITE_CATALOG.filter(s => s.hidden).filter(site => matchKeysForSite(site, allKeys).length > 0);
  if (selectedIds.length === 0 && hiddenExportSites.length === 0) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = t('dyn.selectAtLeastOneSite');
    return;
  }

  const dump = {};
  PROFILE_REGISTRY_KEYS.forEach(k => {
    const v = localStorage.getItem(k);
    if (v !== null) dump[k] = v;
  });
  // 🆕 サイトごとにプロフィール絞り込み（exportProfileFilters）が指定されていれば、
  // そのサイトについては該当プロフィール分のキーだけを含める。選択中の値が現在の
  // プロフィール一覧に実在しない（他タブでのプロフィール削除等による古い選択値）
  // 場合は、データを静かに0件にしてしまわないよう安全側の'all'（従来どおり全プロフィール分）
  // にフォールバックする。
  const profilesNow = getLocalProfilesList();
  selectedIds.forEach(id => {
    const site = SITE_CATALOG.find(s => s.id === id);
    const requestedFilter = exportProfileFilters[id];
    const validFilter = (requestedFilter && requestedFilter !== 'all' && profilesNow.some(p => p.id === requestedFilter))
      ? requestedFilter : 'all';
    matchKeysForSiteProfile(site, allKeys, validFilter).forEach(k => { dump[k] = localStorage.getItem(k); });
  });
  // 🌳 hidden:true のサイト（未公開ツール等）はチェックリストに出さないが、既存データを
  // 引き継ぎから静かに落とさないよう、選択の有無に関わらず常に一緒に含める
  // （PROFILE_REGISTRY_KEYSと同じ「選択UIを介さない」扱い）。
  SITE_CATALOG.filter(s => s.hidden).forEach(site => {
    matchKeysForSite(site, allKeys).forEach(k => { dump[k] = localStorage.getItem(k); });
  });

  // 🕒 送り出す時点の最新状態でサイト別スナップショットを更新し、コードに含める全サイト
  // （非公開サイトも含む）の「最終更新」を埋め込む。取り込み側で「このコードの中身は
  // いつ時点のものか」を判断・比較できるようにするため（インポート確認画面・上書き警告用）。
  const snapshotsAtExport = refreshSiteSnapshots();
  const siteUpdatedAt = {};
  selectedIds.concat(SITE_CATALOG.filter(s => s.hidden).map(s => s.id)).forEach(id => {
    if (snapshotsAtExport[id]) siteUpdatedAt[id] = snapshotsAtExport[id].updatedAt;
  });

  const payload = {
    exportedFrom: 'taipak5000.github.io/tai-transfer/',
    exportedAt: new Date().toISOString(),
    sites: selectedIds,
    siteUpdatedAt,
    data: dump
  };
  const json = JSON.stringify(payload);
  let code, compressRate;
  try {
    const uncompressedLen = bytesToBase64(new TextEncoder().encode(json)).length;
    code = await encodeTransferCode(json);
    compressRate = uncompressedLen > 0 ? Math.max(0, Math.round((1 - code.length / uncompressedLen) * 100)) : 0;
  } catch (e) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = t('dyn.codeGenFailed');
    return;
  }
  lastExportCode = code;
  lastExportResult = { selectedIds, keyCount: Object.keys(dump).length, codeLength: code.length, compressRate, siteUpdatedAt };

  // 🕒 引き継ぎコードの作成に成功した時点を「バックアップ完了」として記録する
  // （ダウンロード/コピー/QR表示はコードを取り出す手段の違いに過ぎず、バックアップ
  // そのものはここで完了している）。
  recordLastExportAt();
  renderLastExportReminder();
  // 🕒 直近の書き出し/読込履歴ログにも同じタイミングで1件追加する（非公開サイトは
  // 既存の.overwriteHiddenNote等と同じく、名前は出さず件数のみを記録する）。
  recordTransferHistoryEntry('export', selectedIds, hiddenExportSites.length);
  renderTransferHistory();
  // 🆕 次回のために、今回チェックが入っていたサイト選択を記憶する。
  saveLastExportSelection(selectedIds);
  // 🆕 前回バックアップからの変更目印を今回のバックアップ時点に合わせて更新する
  // （チェックボックスの選択状態は変えず、目印の表示/非表示だけを切り替える）。
  updateExportChangedBadges();

  renderExportOutput();
  statusEl.className = 'status-msg';
  statusEl.textContent = '';
}

function renderExportOutput() {
  const outputEl = document.getElementById('exportOutputArea');
  if (!lastExportResult) { outputEl.innerHTML = ''; return; }
  const { selectedIds, keyCount, codeLength, compressRate } = lastExportResult;
  const compressNote = compressRate > 0 ? t('dyn.compressNote', { rate: compressRate }) : '';
  // 🌳 選択可能なサイトを1つも選ばず、非公開（hidden）サイトのデータのみが含まれる
  // コードを作成した場合は「選択したサイト: （」のように主語が空になってしまうため、
  // 専用の説明文に差し替える。
  const summary = selectedIds.length === 0
    ? t('dyn.hiddenOnlyExportSummary', { count: keyCount, length: codeLength.toLocaleString(), compressNote })
    : t('dyn.exportSummary', {
        sites: escapeHtml(selectedIds.map(id => {
          const site = SITE_CATALOG.find(s => s.id === id);
          return site ? siteLabel(site) : id;
        }).join(LANG === 'en' ? ', ' : '、')),
        count: keyCount, length: codeLength.toLocaleString(), compressNote
      });
  const qrFeasible = codeLength <= QR_MAX_BYTES;
  // 🕒 選んだサイトごとの「最終更新」一覧（このツールが検知した限りでの最新変更日時）。
  // 古い引き継ぎコードを後から読み込む側が、中身の新しさを判断できるようにするため。
  const updatedRows = selectedIds
    .map(id => {
      const site = SITE_CATALOG.find(s => s.id === id);
      const iso = lastExportResult.siteUpdatedAt && lastExportResult.siteUpdatedAt[id];
      return iso ? `<div class="site-updated-row"><span class="site-updated-name">${escapeHtml(site ? siteLabel(site) : id)}</span><span class="site-updated-date">${escapeHtml(siteUpdatedAtLabel(iso))}</span></div>` : '';
    })
    .filter(Boolean)
    .join('');
  const updatedListHtml = updatedRows
    ? `<div class="status-msg" style="margin-top:10px; margin-bottom:2px;">${t('dyn.siteUpdatedListHeading')}</div><div class="site-updated-list">${updatedRows}</div>`
    : '';
  outputEl.innerHTML = `
    <div class="status-msg">${summary}</div>
    ${updatedListHtml}
    <button type="button" class="action-btn primary" onclick="downloadExportFile()">${t('dyn.downloadBtn')}</button>
    <button type="button" class="action-btn secondary" onclick="toggleExportTextarea()">${t('dyn.showCodeBtn')}</button>
    <div id="exportTextareaArea"></div>
    <button type="button" class="action-btn secondary" onclick="toggleExportLink()">${t('dyn.showLinkBtn')}</button>
    <div id="exportLinkArea"></div>
    ${qrFeasible
      ? `<button type="button" class="action-btn secondary" onclick="toggleExportQr()">${t('dyn.showQrBtn')}</button>`
      : `<div class="status-msg">${t('dyn.qrTooLong')}</div>`}
    <div id="exportQrArea"></div>
  `;
  renderExportTextareaArea();
  renderExportLinkArea();
  renderExportQrArea();
}

function toggleExportTextarea() {
  if (!lastExportCode) return;
  exportTextareaOpen = !exportTextareaOpen;
  renderExportTextareaArea();
}

function renderExportTextareaArea() {
  const area = document.getElementById('exportTextareaArea');
  if (!area) return;
  if (!exportTextareaOpen || !lastExportCode) { area.innerHTML = ''; return; }
  area.innerHTML = `
    <textarea id="codeOutput" class="code-textarea" readonly onclick="this.select()">${escapeHtml(lastExportCode)}</textarea>
    <button type="button" class="action-btn secondary" onclick="copyExportCode()">${t('dyn.copyCodeBtn')}</button>
  `;
}

function downloadExportFile() {
  if (!lastExportCode) return;
  const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  const blob = new Blob([lastExportCode], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `sky-tools-transfer_${stamp}.txt`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  const statusEl = document.getElementById('exportStatus');
  statusEl.className = 'status-msg ok';
  statusEl.textContent = t('dyn.downloadSuccess');
}

async function copyExportCode() {
  const ta = document.getElementById('codeOutput');
  if (!ta) return;
  ta.select();
  const statusEl = document.getElementById('exportStatus');
  try {
    await navigator.clipboard.writeText(ta.value);
    statusEl.className = 'status-msg ok';
    statusEl.textContent = t('dyn.copySuccess');
  } catch (e) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = t('dyn.copyFailed');
  }
}

/* ================================================================
   🔗 URLフラグメント経由でのコード共有
   引き継ぎコードを、サーバーに送信されないURLフラグメント（#以降）にのみ埋め込む
   （クエリ文字列 ?... には絶対に入れない。フラグメントはブラウザ内で完結し、
   ページ読み込み時のHTTPリクエストにも含まれない）。別の端末でこのリンクを開くと、
   下のloadCodeFromUrlFragmentIfPresent()が読み込み時にコードを検出し、貼り付け欄へ
   自動で読み込む。
   ================================================================ */
function buildTransferLink(code) {
  return location.origin + location.pathname + '#code=' + encodeURIComponent(code);
}

function toggleExportLink() {
  if (!lastExportCode) return;
  exportLinkOpen = !exportLinkOpen;
  renderExportLinkArea();
}

function renderExportLinkArea() {
  const area = document.getElementById('exportLinkArea');
  if (!area) return;
  if (!exportLinkOpen || !lastExportCode) { area.innerHTML = ''; return; }
  const link = buildTransferLink(lastExportCode);
  // ⚠️ URL自体に技術的な上限は無いが、あまりに長いリンクは一部のチャット/SMSアプリで
  // 正しく開けないことがあるため、QRコードの容量チェック（QR_MAX_BYTES）と同程度の
  // 長さを超えた場合は注意書きを添える（機能自体は止めない。ハードブロックはしない）。
  const longNote = link.length > QR_MAX_BYTES ? `<div class="status-msg">${t('dyn.linkTooLongNote')}</div>` : '';
  area.innerHTML = `
    <textarea id="linkOutput" class="code-textarea" readonly onclick="this.select()">${escapeHtml(link)}</textarea>
    ${longNote}
    <button type="button" class="action-btn secondary" onclick="copyExportLinkCode()">${t('dyn.copyLinkBtn')}</button>
  `;
}

async function copyExportLinkCode() {
  const ta = document.getElementById('linkOutput');
  if (!ta) return;
  ta.select();
  const statusEl = document.getElementById('exportStatus');
  try {
    await navigator.clipboard.writeText(ta.value);
    statusEl.className = 'status-msg ok';
    statusEl.textContent = t('dyn.copyLinkSuccess');
  } catch (e) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = t('dyn.copyLinkFailed');
  }
}

// ページ読み込み時に #code=... 形式のURLフラグメントが付いていれば、貼り付け欄への
// 手動コピー&ペーストを省略して自動でコードを読み込む（ファイルからの読み込みと同様、
// 「ユーザーが明示的に用意した入力を検出して自動処理する」既存のhandleImportFile()と
// 同じ扱い）。
function extractCodeFromLocationHash() {
  const h = location.hash || '';
  if (!h.startsWith('#code=')) return null;
  try {
    const code = decodeURIComponent(h.slice('#code='.length));
    return code || null;
  } catch (e) { return null; }
}
async function loadCodeFromUrlFragmentIfPresent() {
  const code = extractCodeFromLocationHash();
  if (!code) return;
  // 🔒 コードを読み取ったら、URLバー・ブラウザ履歴にコードが残り続けないよう、
  // 同一ページ内でフラグメントだけを即座に取り除く（サーバーへの新規リクエストは
  // 発生しない。history.replaceStateはページ遷移を伴わない）。
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* noop */ }
  const input = document.getElementById('importCodeInput');
  if (input) input.value = code;
  scrollToId('importSection');
  await processImportCode(code);
  if (pendingImportData) {
    const statusEl = document.getElementById('importStatus');
    if (statusEl && !statusEl.textContent) {
      statusEl.className = 'status-msg ok';
      statusEl.textContent = t('dyn.linkAutoLoadedNotice');
    }
  }
}

/* ================================================================
   📱 QRコード表示（端末間でAirDropやメッセージアプリを使わず、コードを
   カメラで読み取って渡せるようにする追加パネル）。QRコード生成ライブラリ
   （kazuhikoarase/qrcode-generator, MIT・依存ライブラリなし）は、使う瞬間
   まで読み込まない方式でCDNから動的ロードする（他ツールのhtml2canvas
   遅延ロードと同じパターン）。
   ================================================================ */
// QRコード バージョン40・誤り訂正レベルL におけるバイトモードの最大データ量(バイト)。
// これを超えるコードは、実際の生成を試みるまでもなくQR非対応として扱う。
const QR_MAX_BYTES = 2953;

let qrLibLoading = null;
function ensureQrCodeLib() {
  if (window.qrcode) return Promise.resolve();
  if (qrLibLoading) return qrLibLoading;
  qrLibLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
    s.onload = () => resolve();
    s.onerror = () => { qrLibLoading = null; reject(new Error('qrcode lib load failed')); };
    document.head.appendChild(s);
  });
  return qrLibLoading;
}

function toggleExportQr() {
  if (!lastExportCode) return;
  exportQrOpen = !exportQrOpen;
  renderExportQrArea();
}

async function renderExportQrArea() {
  const area = document.getElementById('exportQrArea');
  if (!area) return;
  if (!exportQrOpen || !lastExportCode) { area.innerHTML = ''; return; }
  const code = lastExportCode; // 読み込み待ちの間にコードが再生成/変更されていないかの確認用
  area.innerHTML = `<div class="status-msg">${t('dyn.qrLoading')}</div>`;
  try {
    await ensureQrCodeLib();
  } catch (e) {
    if (code === lastExportCode && exportQrOpen) area.innerHTML = `<div class="status-msg err">${t('dyn.qrLoadFailed')}</div>`;
    return;
  }
  if (code !== lastExportCode || !exportQrOpen) return; // 読み込み中に閉じられた／別コードに変わった場合は何もしない

  try {
    const qr = qrcode(0, 'L'); // typeNumber:0=自動選択, errorCorrectionLevel:L=最大容量優先
    qr.addData(code);
    qr.make();
    const svg = qr.createSvgTag({ scalable: true });
    area.innerHTML = `
      <div class="qr-panel"><div class="qr-box">${svg}</div></div>
      <div class="status-msg">${t('dyn.qrCaption')}</div>
    `;
    // ♿ ライブラリが生成する<svg>にはアクセシブルネームが無いため、スクリーン
    // リーダー向けにrole="img"・aria-label・<title>を後付けで補う。
    const svgEl = area.querySelector('.qr-box svg');
    if (svgEl) {
      const qrAltText = t('dyn.qrAlt');
      svgEl.setAttribute('role', 'img');
      svgEl.setAttribute('aria-label', qrAltText);
      let titleEl = svgEl.querySelector('title');
      if (!titleEl) {
        titleEl = document.createElementNS('http://www.w3.org/2000/svg', 'title');
        svgEl.insertBefore(titleEl, svgEl.firstChild);
      }
      titleEl.textContent = qrAltText;
    }
  } catch (e) {
    // ライブラリ側の容量超過エラー（QR_MAX_BYTESの見積もりに漏れがあった場合の保険）
    area.innerHTML = `<div class="status-msg err">${t('dyn.qrTooLong')}</div>`;
  }
}

/* ================================================================
   📥 インポート（コード読み込み → サイト選択 → 復元）
   ================================================================ */
let pendingImportData = null;
let pendingImportSiteUpdatedAt = null; // { siteId: ISO日時, ... }（インポート元が生成した「サイト別最終更新」。導入前の古いコードには無い）
let lastImportDetected = null; // array of matched SITE_CATALOG entries
let lastImportDataKeys = null;
let lastImportOverwriteInfo = null; // { visible, hiddenOverwriteCount, newProfiles, hasOverwriteRisk }（renderImportChecklist()で算出）
let importOverwriteConfirming = false; // ⚠️ 上書きが発生する復元の2段階確認state
// 🆕 サイト単位ではなくプロフィール単位での引き継ぎ絞り込み（インポート側）：エクスポート側の
// exportProfileFiltersと同じ形（サイトid→'all'または特定のプロフィールid）。新しいコードを
// 読み込むたび（processImportCode()）にリセットする（別のコードでは登場するプロフィールの
// 顔ぶれ自体が変わるため）。
let importProfileFilters = {};

async function loadCodeForImport() {
  const code = document.getElementById('importCodeInput').value.trim();
  if (!code) return;
  await processImportCode(code);
}

function handleImportFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    const code = String(reader.result).trim();
    document.getElementById('importCodeInput').value = code;
    await processImportCode(code);
  };
  reader.onerror = () => {
    const statusEl = document.getElementById('importStatus');
    statusEl.className = 'status-msg err';
    statusEl.textContent = t('dyn.fileReadFailed');
  };
  reader.readAsText(file);
  event.target.value = '';
}

async function processImportCode(code) {
  const statusEl = document.getElementById('importStatus');
  statusEl.className = 'status-msg';
  statusEl.textContent = '';
  pendingImportData = null;
  pendingImportSiteUpdatedAt = null;
  lastImportDetected = null;
  lastImportDataKeys = null;
  lastImportOverwriteInfo = null;
  importOverwriteConfirming = false;
  importProfileFilters = {};
  renderImportSiteArea();

  let payload;
  try {
    payload = JSON.parse(await decodeTransferCode(code));
  } catch (e) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = t('dyn.codeLoadFailed');
    return;
  }
  const data = payload && payload.data && typeof payload.data === 'object' ? payload.data : null;
  if (!data) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = t('dyn.notThisToolCode');
    return;
  }

  pendingImportData = data;
  // 🕒 コード作成側が埋め込んだ「サイト別最終更新」（機能追加前の古いコードには存在しない）
  pendingImportSiteUpdatedAt = (payload.siteUpdatedAt && typeof payload.siteUpdatedAt === 'object') ? payload.siteUpdatedAt : {};
  const dataKeys = Object.keys(data);
  const detected = SITE_CATALOG.filter(site => matchKeysForSite(site, dataKeys).length > 0);
  if (detected.length === 0) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = t('dyn.noMatchingSiteData');
    return;
  }

  // 🌳 hidden:true のサイトはチェックリストには出さない（未公開ツール等）が、コードに
  // 含まれていれば復元自体はconfirmImport()側で常に行うため、ここでは表示用リストから
  // 除くだけで検出判定自体（上のdetected）には影響させない。
  lastImportDetected = detected.filter(site => !site.hidden);
  lastImportDataKeys = dataKeys;
  renderImportSiteArea();
}

/* ================================================================
   📊 上書き警告の「内容差分」要約
   既存の上書き警告（日付比較のみ）を拡張し、インポートされたJSONの中身を現在の
   ローカル値と突き合わせて「実際に何が変わるか」をbest-effortで要約する。特定サイトの
   具体的なデータ構造（例：item側のgameItems_<cat>が{itemOwned:{...},itemFav:{...}}と
   いう形、称号記録が{earned:{<id>:ISO日時},hwm:{...}}という形）を前提にした専用ロジック
   ではなく、JSONの形（配列／オブジェクト）そのものから汎用的に差分を集計する、完全な
   汎用diffビューアではない一言サマリーである。
   ================================================================ */
function tryParseJson(raw) {
  if (raw === null || raw === undefined) return { ok: false };
  try { return { ok: true, value: JSON.parse(raw) }; } catch (e) { return { ok: false }; }
}

// オブジェクト/配列を再帰的に辿り、末端の値ごとに「追加(added)」「消失(removed)」
// 「変化(changed)」を集計する。
//  ・配列同士（プリミティブ／オブジェクトの配列）は「順序を問わない集合」とみなし、要素の
//    値ベースで差分を取る（入手ログ等、レコードが積み上がっていく配列に対応するため）。
//  ・オブジェクト同士はキー単位で比較し、片方にしか無い／真偽値的に「無い」状態から
//    「在る」状態へ変わったキーをadded、その逆をremoved、両方に実在し値が異なるものを
//    changedとする（真偽値マップ型の所持状況・存在マップ型の称号記録のどちらにも対応）。
// depthは異常に深い構造に対する安全策（JSON.parseの出力に循環参照は起こり得ない）。
function diffJsonLeaves(localVal, importedVal, out, depth) {
  if (depth > 8) return;
  const isArr = v => Array.isArray(v);
  const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);

  if (isArr(localVal) || isArr(importedVal)) {
    const a = isArr(localVal) ? localVal : [];
    const b = isArr(importedVal) ? importedVal : [];
    const norm = x => (x !== null && typeof x === 'object') ? JSON.stringify(x) : x;
    const aSet = new Set(a.map(norm));
    const bSet = new Set(b.map(norm));
    b.forEach(x => { if (!aSet.has(norm(x))) out.added++; });
    a.forEach(x => { if (!bSet.has(norm(x))) out.removed++; });
    return;
  }
  if (isObj(localVal) || isObj(importedVal)) {
    const a = isObj(localVal) ? localVal : {};
    const b = isObj(importedVal) ? importedVal : {};
    const keys = new Set(Object.keys(a).concat(Object.keys(b)));
    keys.forEach(k => {
      const av = a[k], bv = b[k];
      if (isObj(av) || isArr(av) || isObj(bv) || isArr(bv)) {
        diffJsonLeaves(av, bv, out, depth + 1);
        return;
      }
      const aHas = Object.prototype.hasOwnProperty.call(a, k) && !!av;
      const bHas = Object.prototype.hasOwnProperty.call(b, k) && !!bv;
      if (bHas && !aHas) out.added++;
      else if (aHas && !bHas) out.removed++;
      else if (aHas && bHas && av !== bv) out.changed++;
    });
  }
}

// 1つのlocalStorageキーについて、現在ローカルにある生の文字列値とインポートされた生の
// 文字列値を比較する。両方ともJSON構造として解釈できる場合は上のdiffJsonLeavesで中身まで
// 踏み込み、片方でも生の文字列/数値のような非構造データの場合は「値が変わったか」だけを
// 1件として計上する（それ以上は中身を解釈できないため）。
function diffKeyValues(localRaw, importedRaw) {
  const out = { added: 0, removed: 0, changed: 0 };
  if (localRaw === importedRaw) return out;
  const lp = tryParseJson(localRaw);
  const ip = tryParseJson(importedRaw);
  const lVal = lp.ok ? lp.value : undefined;
  const iVal = ip.ok ? ip.value : undefined;
  const lIsStruct = lVal !== null && typeof lVal === 'object';
  const iIsStruct = iVal !== null && typeof iVal === 'object';
  if (lIsStruct || iIsStruct) {
    diffJsonLeaves(lIsStruct ? lVal : {}, iIsStruct ? iVal : {}, out, 0);
    return out;
  }
  if (localRaw === null || localRaw === undefined) out.added = 1;
  else if (importedRaw === null || importedRaw === undefined) out.removed = 1;
  else out.changed = 1;
  return out;
}

// サイト単位で、インポートデータに含まれるキー（＝実際に上書きされ得るキー）だけを対象に
// 差分を集計する。ローカルにしか存在しないキー（インポート側に無い）はconfirmImport()でも
// 触れられず上書きされないため、対象外にする。キー名が"Titles_v1"で終わるもの（SITE_CATALOG
// の各サイトに共通する、姉妹サイト横断の称号カタログ用キーの命名規則）は、通常の項目とは
// 別枠で「称号」として集計する。
function computeSiteContentDiff(site, importedData) {
  const importedKeysForSite = matchKeysForSite(site, Object.keys(importedData));
  const totals = { entriesAdded: 0, entriesRemoved: 0, entriesChanged: 0, titlesAdded: 0 };
  importedKeysForSite.forEach(k => {
    const d = diffKeyValues(localStorage.getItem(k), importedData[k]);
    // nsKey()の命名規則（`__p_<profileId>`接尾辞）により、default以外のプロフィールの
    // キーは生のkそのものに正規表現をかけても一致しない。matchKeysForSite()と同じ
    // 前方一致ロジックで、この k がどのSITE_CATALOG素キー（rawKey）由来かを突き止め、
    // そちらに対して称号キー判定を行う。
    const rawKey = site.keys.find(prefix => k === prefix || (site.namespaced && k.startsWith(prefix + '__p')));
    if (/Titles_v1$/i.test(rawKey || k)) totals.titlesAdded += d.added;
    else {
      totals.entriesAdded += d.added;
      totals.entriesRemoved += d.removed;
      totals.entriesChanged += d.changed;
    }
  });
  return totals;
}

// 集計結果を、上書き警告ボックスに添える一言サマリー文字列に組み立てる。何も検出
// できなければ（＝実質的な内容差が無い、または差分を解釈できなかった）空文字を返し、
// その場合は呼び出し側で何も表示しない。
function formatSiteDiffSummary(diff) {
  if (!diff) return '';
  const parts = [];
  if (diff.entriesAdded > 0) parts.push(t('dyn.diffEntriesAdded', { n: diff.entriesAdded }));
  if (diff.titlesAdded > 0) parts.push(t('dyn.diffTitlesAdded', { n: diff.titlesAdded }));
  if (diff.entriesChanged > 0) parts.push(t('dyn.diffEntriesChanged', { n: diff.entriesChanged }));
  if (diff.entriesRemoved > 0) parts.push(t('dyn.diffEntriesRemoved', { n: diff.entriesRemoved }));
  if (parts.length === 0) return '';
  return t('dyn.diffSummaryPrefix') + parts.join(LANG === 'en' ? ', ' : '、');
}

// ⚠️ このインポートで「新しく追加される」のか「既にこの端末にデータがあり上書きされる」
// のかを、サイト単位で判定する（bug #8: 上書き前の警告表示・feature #7: 最終更新の
// 突き合わせで共用）。コード側埋め込みの最終更新（pendingImportSiteUpdatedAt）と、この
// 端末側の最終更新（このツール自身のスナップショット、ここで最新の内容に合わせて
// refreshしておく）を突き合わせ、ローカルの方が新しい場合は特に強調する。
function computeImportOverwriteInfo() {
  const currentLocalKeys = getAllLocalStorageKeys();
  const localSnapshots = refreshSiteSnapshots();
  const visible = (lastImportDetected || []).map(site => {
    const hasLocalData = matchKeysForSite(site, currentLocalKeys).length > 0;
    const localUpdatedAt = (hasLocalData && localSnapshots[site.id]) ? localSnapshots[site.id].updatedAt : null;
    const importUpdatedAt = (pendingImportSiteUpdatedAt && pendingImportSiteUpdatedAt[site.id]) || null;
    // 📊 上書きが起きるサイトについてのみ、内容差分を計算する（新規追加のみのサイトには
    // 「上書きで何が変わるか」という問い自体が発生しないため）。
    const contentDiff = hasLocalData ? computeSiteContentDiff(site, pendingImportData || {}) : null;
    return { site, hasLocalData, localUpdatedAt, importUpdatedAt, contentDiff };
  });
  const hiddenOverwriteCount = SITE_CATALOG
    .filter(s => s.hidden && matchKeysForSite(s, lastImportDataKeys || []).length > 0)
    .filter(site => matchKeysForSite(site, currentLocalKeys).length > 0)
    .length;
  const { newProfiles } = previewProfileMerge(pendingImportData || {});
  return {
    visible,
    hiddenOverwriteCount,
    newProfiles,
    hasOverwriteRisk: visible.some(v => v.hasLocalData) || hiddenOverwriteCount > 0
  };
}

// ⚠️ 上書き・新規プロフィール追加の内訳ボックス。警告すべき内容が無ければ空文字を返す。
function renderImportWarningBoxHtml(info) {
  if (!info) return '';
  const overwriteRows = info.visible.filter(v => v.hasLocalData).map(({ site, localUpdatedAt, importUpdatedAt, contentDiff }) => {
    let text = escapeHtml(siteLabel(site));
    if (importUpdatedAt) {
      const openParen = LANG === 'en' ? ' (' : '（';
      const closeParen = LANG === 'en' ? ')' : '）';
      text += `${openParen}${t('dyn.importCodeDateLabel')}: ${escapeHtml(siteUpdatedAtLabel(importUpdatedAt))}`;
      if (localUpdatedAt) {
        text += ` / ${t('dyn.importLocalDateLabel')}: ${escapeHtml(siteUpdatedAtLabel(localUpdatedAt))}`;
        if (localUpdatedAt > importUpdatedAt) text += t('dyn.importLocalNewerFlag');
      }
      text += closeParen;
    }
    // 📊 「何が変わるか」の内容差分（best-effort。検出できるものが無ければ何も足さない）
    const diffText = formatSiteDiffSummary(contentDiff);
    const diffHtml = diffText ? `<div class="site-diff-note">${escapeHtml(diffText)}</div>` : '';
    return `<div class="site-updated-row overwrite"><span class="site-updated-name">${text}</span></div>${diffHtml}`;
  }).join('');

  const parts = [];
  if (overwriteRows) {
    parts.push(`<div>${t('dyn.overwriteSitesLabel')}</div><div class="site-updated-list">${overwriteRows}</div>`);
    if (info.hiddenOverwriteCount > 0) parts.push(`<div>${t('dyn.overwriteHiddenNote', { n: info.hiddenOverwriteCount })}</div>`);
  } else if (info.hiddenOverwriteCount > 0) {
    parts.push(`<div>${t('dyn.overwriteHiddenOnlyLabel', { n: info.hiddenOverwriteCount })}</div>`);
  }
  if (info.newProfiles.length > 0) {
    const names = info.newProfiles.map(p => escapeHtml(profileDisplayName(p))).join(LANG === 'en' ? ', ' : '、');
    parts.push(`<div>${t('dyn.newProfilesLabel', { n: info.newProfiles.length, names })}</div>`);
  }
  if (parts.length === 0) return '';
  return `<div class="import-warning-box">${parts.join('')}</div>`;
}

function renderImportSiteArea() {
  renderImportChecklist();
  renderImportConfirmArea();
}

function renderImportChecklist() {
  const siteAreaEl = document.getElementById('importSiteArea');
  if (!lastImportDetected || !lastImportDataKeys) {
    siteAreaEl.innerHTML = '';
    lastImportOverwriteInfo = null;
    return;
  }

  lastImportOverwriteInfo = computeImportOverwriteInfo();
  const warningHtml = renderImportWarningBoxHtml(lastImportOverwriteInfo);

  if (lastImportDetected.length === 0) {
    // 🌳 コードに含まれるのが非公開（hidden）サイトのデータのみの場合、選べる項目が
    // 無いのに「復元するサイトを選んでください」ヘッダーや、空の0件チェックリスト＋
    // 動作する全選択/全解除ピルを表示するのは不自然。専用の説明文だけを表示する
    // （復元自体はconfirmImport()側でhiddenSitesとして常に行われる）。
    siteAreaEl.innerHTML = warningHtml + `<div class="status-msg" style="margin-bottom:6px;">${t('dyn.hiddenOnlyImportNotice')}</div>`;
    return;
  }

  // 🆕 サイト単位ではなくプロフィール単位での引き継ぎ絞り込み：選択肢に出すのは、この
  // コードの送り出し側に登録されていたプロフィール一覧（この端末側の一覧ではない）。
  const importedProfiles = getImportedProfilesList();
  siteAreaEl.innerHTML = warningHtml +
    `<div class="status-msg" style="margin-bottom:6px;">${t('dyn.selectSitesToRestore')}</div>` +
    `<div class="list-select-row">
      <button type="button" class="list-select-btn" onclick="setAllSiteCheckboxes('#importSiteArea .import-site-checkbox', true)">${t('page.selectAllBtn')}</button>
      <button type="button" class="list-select-btn" onclick="setAllSiteCheckboxes('#importSiteArea .import-site-checkbox', false)">${t('page.selectNoneBtn')}</button>
    </div>` +
    lastImportOverwriteInfo.visible.map(({ site, hasLocalData }) => {
      const matched = matchKeysForSite(site, lastImportDataKeys);
      // 🆕 コードの中に複数のプロフィール分のデータが含まれている場合のみ、サイトごとの
      // プロフィール絞り込みセレクターを表示する（エクスポート側と同じ条件・見た目）。
      const showProfileFilter = site.namespaced && importedProfiles.length > 1;
      const filterVal = showProfileFilter ? (importProfileFilters[site.id] || 'all') : 'all';
      const filteredMatched = filterVal === 'all' ? matched : matchKeysForSiteProfile(site, lastImportDataKeys, filterVal);
      const rowHtml = `
        <label class="site-opt ${showProfileFilter ? 'has-profile-filter' : ''}" data-site="${site.id}">
          <input type="checkbox" class="import-site-checkbox" data-site="${site.id}" checked>
          <span class="site-opt-label">${escapeHtml(siteLabel(site))}</span>
          <span class="site-opt-count">${t('dyn.keysCount', { n: filteredMatched.length })}${hasLocalData ? ' ⚠️' : ''}</span>
        </label>`;
      const profileRowHtml = showProfileFilter ? `
        <div class="site-opt-profile-row">
          <span aria-hidden="true">👤</span>
          <select class="site-profile-filter" data-site="${site.id}"
            onchange="onImportProfileFilterChange('${site.id}', this.value)"
            aria-label="${escapeHtml(t('page.profileFilterAriaLabel', { site: siteLabel(site) }))}">
            <option value="all" ${filterVal === 'all' ? 'selected' : ''}>${escapeHtml(t('page.allProfilesOption'))} (${t('dyn.keysCount', { n: matched.length })})</option>
            ${importedProfiles.map(p => {
              const cnt = matchKeysForSiteProfile(site, lastImportDataKeys, p.id).length;
              return `<option value="${escapeHtml(p.id)}" ${filterVal === p.id ? 'selected' : ''}>${escapeHtml(profileDisplayName(p))} (${t('dyn.keysCount', { n: cnt })})</option>`;
            }).join('')}
          </select>
        </div>` : '';
      return rowHtml + profileRowHtml;
    }).join('');
}

// 🆕 サイトごとのプロフィール絞り込みセレクター（インポート側）の変更ハンドラ。エクスポート側の
// onExportProfileFilterChange()と同じく、チェックボックスの選択状態を保ったまま、変更された
// サイトの件数表示だけをピンポイントで更新する（renderImportChecklist()を丸ごと再実行すると
// 上書き警告ボックスの再計算や他サイトのチェック状態リセットを伴ってしまうため）。
function onImportProfileFilterChange(siteId, value) {
  importProfileFilters[siteId] = value;
  const site = SITE_CATALOG.find(s => s.id === siteId);
  if (!site || !lastImportDataKeys) return;
  const filtered = matchKeysForSiteProfile(site, lastImportDataKeys, value);
  const countEl = document.querySelector(`#importSiteArea label.site-opt[data-site="${siteId}"] .site-opt-count`);
  if (!countEl) return;
  const hasLocalData = !!(lastImportOverwriteInfo && lastImportOverwriteInfo.visible.some(v => v.site.id === siteId && v.hasLocalData));
  countEl.textContent = t('dyn.keysCount', { n: filtered.length }) + (hasLocalData ? ' ⚠️' : '');
}

// ⚠️ 上書きが発生する場合は、確認ボタンの1クリックでは即実行せず、詳細説明＋2回目の
// 明示クリックを要求する2段階確認にする（item/profiles.jsのdmStartWipe/dmConfirmWipe
// と同じ既存パターンに倣う）。上書きが無い（純粋な新規追加のみの）場合は、従来どおり
// 1クリックでそのまま復元する。
// チェックボックスの状態を保持するため、この確認state変更ではimportSiteAreaを
// 再描画しない（renderImportChecklist()は呼ばず、confirmAreaElのみ更新する）。
function renderImportConfirmArea() {
  const confirmAreaEl = document.getElementById('importConfirmArea');
  if (!lastImportDetected || !lastImportDataKeys) {
    confirmAreaEl.innerHTML = '';
    return;
  }
  if (importOverwriteConfirming) {
    confirmAreaEl.innerHTML = `
      <div class="import-overwrite-confirm">
        <div>${t('dyn.importOverwriteConfirmText')}</div>
        <button type="button" class="action-btn danger" onclick="confirmImport()">${t('dyn.importOverwriteConfirmBtn')}</button>
        <button type="button" class="action-btn secondary" onclick="importCancelOverwriteConfirm()">${t('dyn.cancelBtn')}</button>
      </div>`;
    return;
  }
  const hasRisk = !!(lastImportOverwriteInfo && lastImportOverwriteInfo.hasOverwriteRisk);
  confirmAreaEl.innerHTML = `<button type="button" class="action-btn primary" onclick="${hasRisk ? 'importRestoreClicked()' : 'confirmImport()'}">${t('dyn.restoreBtn')}</button>`;
}
function importRestoreClicked() {
  importOverwriteConfirming = true;
  renderImportConfirmArea();
}
function importCancelOverwriteConfirm() {
  importOverwriteConfirming = false;
  renderImportConfirmArea();
}

function confirmImport() {
  if (!pendingImportData) return;
  // ⚠️ 上書きリスクは最後にチェックリストを描画した時点でのスナップショットであり、
  // 同一オリジンを共有する姉妹サイトを別タブで操作した場合など、実際に書き込む直前には
  // 古くなっている可能性がある。まだ2段階確認（importOverwriteConfirming）を経ていない
  // 直接実行ルートでは、書き込み前に必ず再計算し、新たにリスクが判明した場合は書き込まず
  // 確認ステップへ回す。
  if (!importOverwriteConfirming) {
    lastImportOverwriteInfo = computeImportOverwriteInfo();
    if (lastImportOverwriteInfo.hasOverwriteRisk) {
      importRestoreClicked();
      return;
    }
  }
  const statusEl = document.getElementById('importStatus');
  const dataKeys = Object.keys(pendingImportData);
  const selectedIds = [...document.querySelectorAll('#importSiteArea .import-site-checkbox:checked')].map(el => el.dataset.site);
  const hiddenSites = SITE_CATALOG.filter(s => s.hidden);
  const hasHiddenData = hiddenSites.some(site => matchKeysForSite(site, dataKeys).length > 0);
  if (selectedIds.length === 0 && !hasHiddenData) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = t('dyn.selectAtLeastOneSite');
    return;
  }

  let count = 0;
  // 🆕 サイトごとにプロフィール絞り込み（importProfileFilters）が指定されていれば、
  // そのサイトについては該当プロフィール分のキーだけを復元する。選択中の値がこの
  // コードに実在するプロフィールでない（表示後にコードが読み込み直された等）場合は、
  // データを静かに0件にしてしまわないよう安全側の'all'（従来どおり全プロフィール分）
  // にフォールバックする（generateExportCode()側の同種の安全策と同じ考え方）。
  // サイトごとの実際の絞り込み値を先に確定させ、プロフィール一覧マージ（下の
  // applyProfileMerge）とデータ復元の両方でこの同じ値を使う。
  const importedProfilesNow = getImportedProfilesList();
  const siteValidFilter = {};
  selectedIds.forEach(id => {
    const requestedFilter = importProfileFilters[id];
    siteValidFilter[id] = (requestedFilter && requestedFilter !== 'all' && importedProfilesNow.some(p => p.id === requestedFilter))
      ? requestedFilter : 'all';
  });
  // 🔀 プロフィール一覧・アクティブポインタは単純上書きせず、既存の登録内容とマージする
  // （bug #1）。ただし、サイトの絞り込みで明示的に除外され、選択中のどのサイトからも
  // データが1件も復元されないプロフィールは、一覧にも追加しない（追加すると中身の無い
  // "ゴースト"プロフィールになってしまうため）。hidden:true のサイトは絞り込みUIが無く
  // 常に全プロフィール分を復元するため、そちらにデータがあるプロフィールは常に許可する。
  const allowedProfileIds = new Set();
  selectedIds.forEach(id => {
    const site = SITE_CATALOG.find(s => s.id === id);
    if (!site || !site.namespaced) return;
    const filter = siteValidFilter[id];
    importedProfilesNow.forEach(p => {
      if ((filter === 'all' || filter === p.id) && matchKeysForSiteProfile(site, dataKeys, p.id).length > 0) {
        allowedProfileIds.add(p.id);
      }
    });
  });
  SITE_CATALOG.filter(s => s.hidden && s.namespaced).forEach(site => {
    importedProfilesNow.forEach(p => {
      if (matchKeysForSiteProfile(site, dataKeys, p.id).length > 0) allowedProfileIds.add(p.id);
    });
  });
  // 🩹 localStorage.setItem()は保存容量の上限等でthrowすることがある。以前はガード無しの
  // forEach内で直接呼んでいたため、1件でも失敗すると例外がforEach自体を打ち切り、それ以降の
  // キー・それ以降のサイト・hiddenSitesの復元まで全て静かに中断されてしまっていた
  // （tai-itemのインポートで実際にユーザー報告のあった不具合と同じ原因）。1件ずつtry/catchで
  // 保護し、失敗したキーがあっても残りの復元を継続させる。
  const failedKeys = [];
  function safeSetItem(k, v) {
    try { localStorage.setItem(k, v); count++; }
    catch (e) { failedKeys.push(k); }
  }
  const { count: registryCount, newProfiles, failedKeys: registryFailedKeys } = applyProfileMerge(pendingImportData, allowedProfileIds);
  count += registryCount;
  failedKeys.push(...registryFailedKeys);
  selectedIds.forEach(id => {
    const site = SITE_CATALOG.find(s => s.id === id);
    matchKeysForSiteProfile(site, dataKeys, siteValidFilter[id]).forEach(k => safeSetItem(k, pendingImportData[k]));
  });
  // 🌳 hidden:true のサイトはチェックリストに出ないため選択できないが、コードに含まれて
  // いれば選択の有無に関わらず常に復元する（既存データを静かに落とさないため）。
  hiddenSites.forEach(site => {
    matchKeysForSite(site, dataKeys).forEach(k => safeSetItem(k, pendingImportData[k]));
  });
  // 🕒 直近の書き出し/読込履歴ログにも1件追加する（非公開サイトは名前を出さず件数のみ記録）。
  const hiddenImportSiteCount = hiddenSites.filter(site => matchKeysForSite(site, dataKeys).length > 0).length;
  recordTransferHistoryEntry('import', selectedIds, hiddenImportSiteCount);

  statusEl.className = failedKeys.length > 0 ? 'status-msg err' : 'status-msg ok';
  statusEl.textContent = t('dyn.restoreSuccess', { n: count }) + (newProfiles.length > 0
    ? ' ' + t('dyn.restoreSuccessNewProfiles', { n: newProfiles.length, names: newProfiles.map(profileDisplayName).join(LANG === 'en' ? ', ' : '、') })
    : '') + (failedKeys.length > 0 ? t('dyn.restoreFailedKeys', { n: failedKeys.length }) : '');
  pendingImportData = null;
  pendingImportSiteUpdatedAt = null;
  lastImportDetected = null;
  lastImportDataKeys = null;
  lastImportOverwriteInfo = null;
  importOverwriteConfirming = false;
  importProfileFilters = {};
  document.getElementById('importSiteArea').innerHTML = '';
  document.getElementById('importConfirmArea').innerHTML = '';
  document.getElementById('importCodeInput').value = '';
  refreshSiteSnapshots(); // 🕒 インポートで書き込んだ内容を、このツールの「最終更新」把握にも反映する
  renderExportSiteList(); // インポートで書き込んだデータを、エクスポート側のチェックリスト/件数へ即反映する
  renderTransferHistory(); // 🕒 今回の読込を履歴ログに即反映する
  resetExportOutput(); // インポート前に作成済みだったエクスポートコードは新データを含まず古くなるため破棄する
}

/* ================================================================
   初期化
   ================================================================ */
applyI18n();
applyThemeToDOM();
refreshSiteSnapshots(); // 🕒 このツールの「最終更新」把握を、今この端末にある最新の中身に合わせて更新する
renderExportSiteList();
renderLastExportReminder(); // 🕒 「最終バックアップ」リマインダーを初期表示する
renderTransferHistory(); // 🕒 書き出し/読込履歴ログを初期表示する
loadCodeFromUrlFragmentIfPresent(); // 🔗 #code=... 付きのリンクで開かれた場合、コードを自動で読み込む
</script>
<script>
/* Fluid bottom sheet: Pointer Events + spring physics. 1:1 finger tracking, hands
   off velocity on release, decides open/close by momentum projection, rubberband
   above the top, interruptible mid-animation grabs. Simple tap open/close is left
   to a CSS transition (cheap); only drag/flick physics runs through this JS. */
(function () {
  'use strict';
  var OPEN_CLASS = 'show';
  var OVERLAY_SEL = '.modal-overlay';
  var CARD_SEL = '.modal-card';
  var REDUCE_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)');
  var sheets = {};
  var active = null;

  function spring(damping, response) { return { zeta: damping, omega: (2 * Math.PI) / response }; }
  var SPRING_PRESENT = spring(1.0, 0.4);
  var SPRING_FLICK = spring(0.8, 0.3);

  function project(v, d) { d = d || 0.998; return (v / 1000) * d / (1 - d); }
  function rubberband(over, dim, c) { c = c || 0.55; return (over * dim * c) / (dim + c * Math.abs(over)); }

  function matchesOverlay(el) { return !!(el && el.matches && el.matches(OVERLAY_SEL)); }
  function keyOf(overlay) { if (!overlay.id) overlay.id = 'sheet-' + Math.random().toString(36).slice(2); return overlay.id; }
  function stateFor(overlay) {
    var key = keyOf(overlay);
    var s = sheets[key];
    var card = overlay.querySelector(CARD_SEL);
    if (!s) {
      s = sheets[key] = { overlay: overlay, card: card, y: 0, v: 0, target: 0, height: 0, raf: null, last: 0,
        spring: SPRING_PRESENT, dragging: false, pointerId: null, grabY: 0, hist: [], onSettle: null, closedByGesture: false };
    } else if (s.card !== card) { s.card = card; }
    return s;
  }
  function measure(s) { s.height = s.card.getBoundingClientRect().height || window.innerHeight; }
  function render(s) {
    s.card.style.transform = 'translate3d(0,' + s.y.toFixed(2) + 'px,0)';
    var p = 1 - Math.min(Math.max(s.y / s.height, 0), 1);
    s.overlay.style.setProperty('--sheet-progress', p.toFixed(3));
  }
  function stopAnim(s) { if (s.raf) { cancelAnimationFrame(s.raf); s.raf = null; } }
  function readCardY(card) {
    var m = getComputedStyle(card).transform;
    if (!m || m === 'none') return 0;
    var parts = m.match(/matrix3d\(([^)]+)\)/);
    if (parts) { var v = parts[1].split(',').map(Number); return v[13] || 0; }
    var m2 = m.match(/matrix\(([^)]+)\)/);
    if (m2) { var v2 = m2[1].split(',').map(Number); return v2[5] || 0; }
    return 0;
  }
  function animateTo(s, target, sp, velocity, onSettle) {
    stopAnim(s);
    s.card.classList.add('js-anim');
    s.target = target; s.spring = sp; s.onSettle = onSettle || null;
    if (typeof velocity === 'number') s.v = velocity;
    s.last = performance.now();
    function step(now) {
      var dt = Math.min((now - s.last) / 1000, 0.1); s.last = now;
      var steps = Math.max(1, Math.ceil(dt / 0.004));
      var h = dt / steps;
      for (var i = 0; i < steps; i++) {
        var x = s.y - s.target;
        var a = -2 * s.spring.zeta * s.spring.omega * s.v - s.spring.omega * s.spring.omega * x;
        s.v += a * h; s.y += s.v * h;
      }
      if (Math.abs(s.y - s.target) < 0.5 && Math.abs(s.v) < 20) {
        s.y = s.target; s.v = 0; render(s); s.raf = null;
        s.card.classList.remove('js-anim');
        if (s.onSettle) { var fn = s.onSettle; s.onSettle = null; fn(); }
        return;
      }
      render(s);
      s.raf = requestAnimationFrame(step);
    }
    s.raf = requestAnimationFrame(step);
  }

  // Fill this in with this site's own modal-id -> close-function map (read it off
  // each overlay's onclick="if(event.target===this) XXX()" background-click-to-close handler)
  var CLOSE_FN = {
    'settingsModal': 'settingsClose',
  };
  function closeOverlay(overlay) {
    var name = CLOSE_FN[overlay.id];
    if (name && typeof window[name] === 'function') { window[name](); return; }
    overlay.classList.remove(OPEN_CLASS);
  }
  function finishHide(s) {
    clearTimeout(s.hideTimer);
    s.card.classList.remove('js-anim');
    s.overlay.classList.remove('is-closing');
    s.card.style.transform = '';
    s.overlay.style.removeProperty('--sheet-progress');
    s.y = 0; s.v = 0;
  }
  function onVisibilityChange(overlay, visible) {
    if (REDUCE_MOTION.matches) return;
    var s = stateFor(overlay);
    if (!s.card) return;
    if (s.dragging) return;
    stopAnim(s);
    s.card.classList.remove('js-anim');
    clearTimeout(s.hideTimer);
    if (visible) {
      var wasHidden = !s.card.style.transform && overlay.style.getPropertyValue('--sheet-progress') === '';
      overlay.classList.remove('is-closing');
      if (wasHidden) {
        measure(s);
        s.card.style.transform = 'translate3d(0,' + s.height + 'px,0)';
        overlay.style.setProperty('--sheet-progress', '0');
        void s.card.offsetHeight;
      }
      s.card.style.transform = 'translate3d(0,0,0)';
      overlay.style.setProperty('--sheet-progress', '1');
      s.y = 0; s.v = 0;
    } else {
      if (s.closedByGesture) { s.closedByGesture = false; finishHide(s); return; }
      measure(s);
      overlay.classList.add('is-closing');
      s.card.style.transform = 'translate3d(0,' + s.height + 'px,0)';
      overlay.style.setProperty('--sheet-progress', '0');
      s.y = s.height; s.v = 0;
      s.hideTimer = setTimeout(function () { finishHide(s); }, 340);
    }
  }
  new MutationObserver(function (records) {
    records.forEach(function (r) {
      var el = r.target;
      if (!matchesOverlay(el)) return;
      var was = (' ' + (r.oldValue || '') + ' ').indexOf(' ' + OPEN_CLASS + ' ') !== -1;
      var now = el.classList.contains(OPEN_CLASS);
      if (was !== now) onVisibilityChange(el, now);
    });
  }).observe(document.documentElement, { attributes: true, attributeFilter: ['class'], subtree: true, attributeOldValue: true });

  function isInteractive(el) {
    return !!(el && el.closest && el.closest('input, select, textarea, button, a, label, [contenteditable], [role="button"], input[type="range"]'));
  }
  document.addEventListener('pointerdown', function (e) {
    if (REDUCE_MOTION.matches) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    var card = e.target && e.target.closest ? e.target.closest(CARD_SEL) : null;
    if (!card) return;
    var overlay = card.closest(OVERLAY_SEL);
    if (!overlay || !overlay.classList.contains(OPEN_CLASS) || isInteractive(e.target)) return;
    var s = stateFor(overlay);
    measure(s);
    stopAnim(s);
    s.y = readCardY(s.card);
    s.pointerId = e.pointerId;
    s.grabY = e.clientY - s.y;
    s.hist = [{ t: performance.now(), y: e.clientY }];
    s.dragging = false;
    active = s;
  }, { passive: true });
  document.addEventListener('pointermove', function (e) {
    var s = active; if (!s || e.pointerId !== s.pointerId) return;
    s.hist.push({ t: performance.now(), y: e.clientY }); if (s.hist.length > 6) s.hist.shift();
    if (!s.dragging) {
      var moved = e.clientY - s.hist[0].y;
      if (Math.abs(moved) < 10) return;
      if (moved < 0 || s.card.scrollTop > 0) { active = null; return; }
      s.dragging = true;
      s.card.classList.add('is-dragging');
      try { s.card.setPointerCapture(e.pointerId); } catch (_) {}
    }
    var y = e.clientY - s.grabY;
    if (y < 0) y = rubberband(y, s.height);
    s.y = y; render(s);
  });
  document.addEventListener('touchmove', function (e) {
    if (active && active.dragging && e.cancelable) e.preventDefault();
  }, { passive: false });
  function release(e) {
    var s = active; if (!s || e.pointerId !== s.pointerId) return;
    active = null;
    if (!s.dragging) return;
    s.dragging = false; s.card.classList.remove('is-dragging');
    try { s.card.releasePointerCapture(e.pointerId); } catch (_) {}
    var h = s.hist, v = 0;
    if (h.length >= 2) {
      var b = h[h.length - 1], a = b;
      for (var i = h.length - 2; i >= 0; i--) { if (b.t - h[i].t > 100) break; a = h[i]; }
      var dt = (b.t - a.t) / 1000; if (dt > 0) v = (b.y - a.y) / dt;
    }
    var projected = s.y + project(v);
    var shouldClose = Math.abs(v) > 250 ? v > 0 : projected > s.height * 0.5;
    if (shouldClose) {
      animateTo(s, s.height, SPRING_FLICK, v, function () { s.closedByGesture = true; closeOverlay(s.overlay); });
    } else {
      animateTo(s, 0, SPRING_FLICK, v, null);
    }
  }
  document.addEventListener('pointerup', release);
  document.addEventListener('pointercancel', release);
})();
</script>
</body>
</html>
