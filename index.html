<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    /* 🌙 ダーク/ライト表示の初期反映（Vue等の描画前に同期実行し、意図しない
       配色でのちらつき「FOUC」を防止する）。sky_app_theme は taipak5000.github.io
       系ツール共通のプレーンなグローバルキー（sky_app_lang と同じ扱い）。 */
    (function () {
      try {
        var saved = localStorage.getItem('sky_app_theme');
        var isDark = saved ? (saved === 'dark') : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/app-icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="データ引継ぎ">
  <meta name="theme-color" content="#AF52DE">
  <title>データ引継ぎ - Sky所持率管理</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #F2F2F7;
      --card:      #FFFFFF;
      --sep:       rgba(60,60,67,0.12);
      --purple:    #AF52DE;
      --purple-d:  #8E3FB8;
      --purple-bg: rgba(175,82,222,0.10);
      --blue:      #007AFF;
      --green:     #34C759;
      --red:       #FF3B30;
      --text:      #1C1C1E;
      --text-2:    #8E8E93;
      --text-3:    #C7C7CC;
      --r:         16px;
      --r-sm:      10px;
    }

    /* 🌙 ダークモード用のカラー上書き（:root と同等の詳細度なので、ソース順で
       後に書くことで上書きされる）。アクセントの色相はライト版から変えず、
       --purple-d と --purple-bg のみ、暗い背景でも読みやすいよう調整している。 */
    [data-theme="dark"] {
      --bg:        #000000;
      --card:      #1C1C1E;
      --sep:       rgba(255,255,255,0.14);
      --purple-d:  #C77DFF;
      --purple-bg: rgba(175,82,222,0.22);
      --text:      #F2F2F7;
      --text-2:    #98989D;
      --text-3:    #636366;
    }
    [data-theme="dark"] nav { background: rgba(0,0,0,0.75); }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    a { text-decoration:none; color:inherit; -webkit-tap-highlight-color:transparent; }
    button { cursor:pointer; border:none; background:none; font-family:inherit; }
    input, select, textarea { font-family:inherit; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      /* 画面下部固定のsite-dock(クイックメニュー)にコンテンツ末尾が隠れないための余白 */
      padding-bottom: calc(76px + env(safe-area-inset-bottom));
    }

    nav {
      position: sticky; top: 0; z-index: 20;
      background: rgba(242,242,247,0.88); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 0.5px solid var(--sep); padding: 14px 20px 12px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-title { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
    .nav-actions { display: flex; align-items: center; gap: 8px; }
    .sidebar-toggle-btn, .lang-toggle-btn, .settings-toggle-btn {
      background: var(--card); border: 1px solid var(--sep); border-radius: var(--r-sm);
      padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--text);
      display: flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    @media (min-width: 850px) { .sidebar-toggle-btn { visibility: hidden; } }

    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 499; }
    .sidebar-overlay.show { display: block; }

    .app-layout { max-width: 720px; margin: 0 auto; padding: 0 16px; }
    @media (min-width: 850px) { .app-layout { max-width: 960px; display: flex; gap: 20px; align-items: flex-start; } }
    .wrap { flex: 1; min-width: 0; }

    .sidebar {
      width: 200px; flex-shrink: 0; position: sticky; top: 58px;
      background: var(--card); border-radius: var(--r); padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07); display: none; margin-top: 22px;
    }
    @media (min-width: 850px) { .sidebar { display: block; } }
    .sidebar.sidebar-open {
      display: flex !important; flex-direction: column; position: fixed; top: 0; left: 0;
      height: 100%; width: 240px; z-index: 500; overflow-y: auto; margin-top: 0;
      border-radius: 0 12px 12px 0; box-shadow: 4px 0 24px rgba(0,0,0,0.2);
    }
    .sidebar-close-btn {
      background: none; border: none; font-size: 22px; cursor: pointer;
      color: var(--text-2); padding: 0; line-height: 1; flex-shrink: 0; display: none;
    }
    .sidebar.sidebar-open .sidebar-close-btn { display: block; }
    .sidebar-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .sidebar-section-label { font-size: 11px; font-weight: 700; color: var(--text-2); text-transform: uppercase; }
    .sidebar-nav-link {
      display: flex; align-items: center; gap: 9px; padding: 9px 12px; border-radius: var(--r-sm);
      color: var(--text); font-size: 13.5px; font-weight: 500; margin-bottom: 2px;
      width: 100%; box-sizing: border-box; white-space: nowrap;
    }
    .sidebar-nav-link:hover { background: var(--bg); }
    .sidebar-nav-link.current-tool { background: var(--purple-bg); color: var(--purple-d); font-weight: 700; }

    .sec-label { font-size: 13px; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.4px; padding: 22px 4px 10px; }
    .card { background: var(--card); border-radius: var(--r); padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
    .hint { font-size: 12.5px; color: var(--text-2); line-height: 1.7; margin-bottom: 14px; }

    .site-opt {
      display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 0.5px solid var(--sep);
      cursor: pointer;
    }
    .site-opt:last-of-type { border-bottom: none; }
    .site-opt input[type="checkbox"] { width: 18px; height: 18px; flex-shrink: 0; accent-color: var(--purple); }
    .site-opt-label { flex: 1; font-size: 14px; color: var(--text); }
    .site-opt-count { font-size: 12px; color: var(--text-2); }
    .site-opt.no-data { opacity: 0.45; }

    .action-btn {
      display: block; width: 100%; padding: 12px; border-radius: var(--r-sm); font-size: 14.5px; font-weight: 700;
      text-align: center; cursor: pointer; margin-top: 12px; box-sizing: border-box;
    }
    .action-btn.primary { background: var(--purple); color: #fff; }
    .action-btn.secondary { background: var(--bg); color: var(--text); border: 1px solid var(--sep); }

    .code-textarea {
      width: 100%; box-sizing: border-box; border: 1px solid var(--sep); border-radius: var(--r-sm);
      padding: 10px 12px; font-size: 11px; font-family: monospace; color: var(--text);
      resize: vertical; min-height: 110px; background: var(--bg); outline: none; margin-top: 10px;
    }
    .code-textarea:focus { border-color: var(--purple); }
    input[type="file"] {
      width: 100%; box-sizing: border-box; font-size: 12.5px; color: var(--text-2);
      border: 1px dashed var(--sep); border-radius: var(--r-sm); padding: 10px 12px; margin-top: 10px;
    }
    .status-msg { font-size: 12.5px; color: var(--text-2); margin-top: 10px; line-height: 1.6; }
    .status-msg.ok { color: var(--green); }
    .status-msg.err { color: var(--red); }

    footer { text-align: center; font-size: 11.5px; color: var(--text-3); padding: 34px 16px 12px; line-height: 1.9; }
    footer a { color: var(--purple-d); text-decoration: none; }

    /* ⚙️ 表示設定モーダル（ダークモード切替・キーボードショートカット設定） */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 600;
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal-card {
      width: 100%; max-width: 360px; max-height: 80vh; overflow-y: auto;
      background: var(--card); border-radius: var(--r); padding: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3); box-sizing: border-box;
    }
    .modal-card h3 {
      margin: 0 0 14px; font-size: 16px; font-weight: 700; color: var(--text);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .modal-close-x { background: none; border: none; font-size: 20px; color: var(--text-2); cursor: pointer; line-height: 1; padding: 0; }
    .settings-section { margin-top: 16px; }
    .settings-section:first-of-type { margin-top: 0; }
    .settings-section-label {
      font-size: 12px; font-weight: 700; color: var(--text-2); text-transform: uppercase;
      letter-spacing: 0.4px; margin: 0 0 8px;
    }
    .settings-row {
      display: flex; align-items: center; gap: 8px; padding: 9px 11px; background: var(--bg);
      border-radius: var(--r-sm); margin-bottom: 6px; font-size: 13.5px; color: var(--text);
    }
    .settings-row:last-child { margin-bottom: 0; }
    .settings-row-text { flex: 1; min-width: 0; }
    .theme-toggle-btn {
      background: var(--card); border: 1px solid var(--sep); color: var(--text);
      padding: 6px 12px; font-size: 12px; border-radius: 20px; cursor: pointer; font-weight: 700; white-space: nowrap;
    }
    /* 🌐 表示設定モーダル内の言語セレクター（1言語=1ボタン。トグルではなく選択式）。
       選択中の言語は.sidebar-nav-link.current-toolと同じpurpleアクセント配色で強調する。 */
    .lang-select-row { display: flex; gap: 8px; }
    .lang-select-btn {
      flex: 1; background: var(--card); border: 1px solid var(--sep); color: var(--text);
      padding: 8px 10px; font-size: 13px; border-radius: var(--r-sm); cursor: pointer;
      font-weight: 600; text-align: center;
    }
    .lang-select-btn.active { background: var(--purple-bg); border-color: var(--purple); color: var(--purple-d); font-weight: 700; }
    .settings-key {
      flex-shrink: 0; min-width: 30px; text-align: center; font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px;
      background: var(--card); border: 1px solid var(--sep); border-radius: 5px; padding: 2px 6px; color: var(--text);
    }
    .settings-close-btn {
      display: block; width: 100%; margin-top: 16px; background: var(--bg); border: 1px solid var(--sep);
      color: var(--text); border-radius: var(--r-sm); padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
    }

    /* 🧭 サイトドック（画面下部固定のクイックアクセスバー）：既存のハンバーガー
       サイドバーとは別系統で並存する、常時表示のショートカット行。pengram.jp系
       サイトに倣ったUIパターンで、companion/emote/share/star-candleに導入済み。
       選択中タブの概念はなく（pengram本体にも無し）、:activeの押下フィードバックのみ。
       このnavは上部の`nav`用セレクタ（position:sticky/border-bottom等）にもマッチして
       しまうため、position/top/border-bottom を明示的に上書きする（top:autoが特に必須。
       指定しないと上部navのtop:0が漏れて画面全体を覆う要素になってしまう）。 */
    .site-dock {
      display: flex; position: fixed; top: auto; left: 0; right: 0; bottom: 0; z-index: 90;
      padding: 6px 10px calc(8px + env(safe-area-inset-bottom));
      background: var(--card); border-bottom: none;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-top: 0.5px solid var(--sep);
      justify-content: space-around; align-items: stretch; gap: 4px;
    }
    /* 上部nav用ダークモード背景上書き（[data-theme="dark"] nav）の方が詳細度が高く
       この要素にも波及するため、専用セレクタで明示的に上書きする */
    [data-theme="dark"] .site-dock { background: var(--card); }
    .site-dock button {
      flex: 1 1 0; max-width: 110px; border: 0; background: none; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 6px 0; min-height: 52px; border-radius: 12px; font-family: inherit;
    }
    .site-dock button:active { background: var(--sep); }
    .site-dock .site-dock-icon { font-size: 20px; line-height: 1; }
    .site-dock .site-dock-label { font-size: 10px; font-weight: 700; color: var(--text-2); }
  </style>
</head>
<body>

<nav>
  <div class="nav-title" data-i18n="tools.dataTransfer"></div>
  <div class="nav-actions">
    <button class="lang-toggle-btn" id="langToggleBtn" onclick="toggleLang()">EN</button>
    <button class="settings-toggle-btn" onclick="settingsOpen()" data-i18n-title="settings.entryBtnTitle">⚙️</button>
    <button class="sidebar-toggle-btn" onclick="toggleSidebar()" data-i18n="sidebar.hamburgerToggle"></button>
  </div>
</nav>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="sidebar-section-label" data-i18n="sidebar.relatedToolsLabel"></div>
      <button class="sidebar-close-btn" onclick="toggleSidebar()">✕</button>
    </div>
    <a href="https://taipak5000.github.io/tai-item/" class="sidebar-nav-link" data-i18n="tools.item"></a>
    <a href="https://taipak5000.github.io/tai-emote/" class="sidebar-nav-link" data-i18n="tools.emote"></a>
    <a href="https://taipak5000.github.io/share/" class="sidebar-nav-link" data-i18n="tools.share"></a>
    <a href="https://taipak5000.github.io/tai-nomacan/" class="sidebar-nav-link" data-i18n="tools.taiNomacan"></a>
    <a href="https://taipak5000.github.io/star-candle/" class="sidebar-nav-link" data-i18n="tools.starCandle"></a>
    <a href="https://taipak5000.github.io/companion/" class="sidebar-nav-link" data-i18n="tools.companion"></a>
    <a href="https://taipak5000.github.io/wings/" class="sidebar-nav-link" data-i18n="tools.wings"></a>
    <a href="https://taipak5000.github.io/tai-transfer/" class="sidebar-nav-link current-tool" data-i18n="tools.dataTransfer"></a>
  </aside>

  <div class="wrap">
    <p class="sec-label" id="exportSection" data-i18n="page.sectionExport"></p>
    <div class="card">
      <div class="hint" data-i18n="page.exportHint"></div>
      <div id="exportSiteList"></div>
      <button type="button" class="action-btn primary" onclick="generateExportCode()" data-i18n="page.createCodeBtn"></button>
      <div id="exportOutputArea"></div>
      <div id="exportStatus" class="status-msg"></div>
    </div>

    <p class="sec-label" id="importSection" data-i18n="page.sectionImport"></p>
    <div class="card">
      <div class="hint" data-i18n="page.importHint"></div>
      <input type="file" id="importFileInput" accept=".txt,.json" onchange="handleImportFile(event)">
      <div class="hint" style="margin:10px 0 6px;" data-i18n="page.pasteHint"></div>
      <textarea id="importCodeInput" class="code-textarea" placeholder="ここに引き継ぎコードを貼り付け" data-i18n-placeholder="page.pastePlaceholder"></textarea>
      <button type="button" class="action-btn secondary" onclick="loadCodeForImport()" data-i18n="page.loadCodeBtn"></button>
      <div id="importSiteArea"></div>
      <div id="importConfirmArea"></div>
      <div id="importStatus" class="status-msg"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="settingsModal" onclick="if (event.target === this) settingsClose();">
  <div class="modal-card">
    <h3>
      <span data-i18n="settings.title"></span>
      <button type="button" class="modal-close-x" onclick="settingsClose()" aria-label="Close">✕</button>
    </h3>

    <div class="settings-section">
      <p class="settings-section-label" data-i18n="settings.displayLabel"></p>
      <div class="settings-row">
        <span>🌙</span>
        <span class="settings-row-text" data-i18n="settings.darkModeLabel"></span>
        <button type="button" class="theme-toggle-btn" id="settingsThemeBtn" onclick="toggleTheme()"></button>
      </div>
    </div>

    <div class="settings-section">
      <p class="settings-section-label" data-i18n="settings.shortcutsLabel"></p>
      <div class="settings-row">
        <span>⌨️</span>
        <span class="settings-row-text" data-i18n="settings.shortcutsEnableLabel"></span>
        <input type="checkbox" id="shortcutsCheckbox" onchange="onShortcutsCheckboxChange()" style="width:19px; height:19px; flex-shrink:0; cursor:pointer; accent-color:var(--purple);">
      </div>
      <div class="settings-row">
        <span class="settings-key">?</span>
        <span class="settings-row-text" data-i18n="settings.shortcutOpen"></span>
      </div>
      <div class="settings-row">
        <span class="settings-key">D</span>
        <span class="settings-row-text" data-i18n="settings.shortcutTheme"></span>
      </div>
      <div class="settings-row">
        <span class="settings-key">Esc</span>
        <span class="settings-row-text" data-i18n="settings.shortcutEscape"></span>
      </div>
    </div>

    <div class="settings-section">
      <p class="settings-section-label" data-i18n="settings.langLabel"></p>
      <div class="lang-select-row">
        <button type="button" class="lang-select-btn" id="settingsLangJaBtn" onclick="setLang('ja')">日本語</button>
        <button type="button" class="lang-select-btn" id="settingsLangEnBtn" onclick="setLang('en')">English</button>
      </div>
    </div>

    <button type="button" class="settings-close-btn" onclick="settingsClose()" data-i18n="settings.closeBtn"></button>
  </div>
</div>

<footer>
  <span data-i18n="footer.disclaimer"></span><br>
  <span data-i18n="footer.creditLabel"></span> <a href="https://x.com/Skyzztai" target="_blank" rel="noopener noreferrer">@Skyzztai</a>　／
  <a href="https://odaibako.net/u/Skyzztai" target="_blank" rel="noopener noreferrer" data-i18n="footer.requestForm"></a><br>
  <a href="https://taipak5000.github.io/tai-info/" target="_blank" rel="noopener noreferrer" data-i18n="footer.infoLink"></a>
</footer>

<!-- 🧭 site-dock（クイックメニュー）: 既存のハンバーガーサイドバーと並存するショートカット行 -->
<nav class="site-dock" aria-label="クイックメニュー" data-i18n-aria-label="dock.ariaLabel">
  <button type="button" onclick="scrollToId('exportSection')">
    <span class="site-dock-icon">📤</span>
    <span class="site-dock-label" data-i18n="dock.export">エクスポート</span>
  </button>
  <button type="button" onclick="scrollToId('importSection')">
    <span class="site-dock-icon">📥</span>
    <span class="site-dock-label" data-i18n="dock.import">インポート</span>
  </button>
  <button type="button" onclick="toggleSidebar()">
    <span class="site-dock-icon">☰</span>
    <span class="site-dock-label" data-i18n="dock.otherTools">他のツール</span>
  </button>
  <button type="button" onclick="settingsOpen()">
    <span class="site-dock-icon">⚙️</span>
    <span class="site-dock-label" data-i18n="dock.settings">表示設定</span>
  </button>
</nav>

<script>
/* ================================================================
   多言語対応（i18n）
   sky_app_lang は taipak5000.github.io 系ツール共通のプレーンな
   グローバルキー（プロフィールごとの nsKey() 対象外。sky_app_theme と同じ扱い）。
   ================================================================ */
const LANG_KEY = 'sky_app_lang';
let LANG = localStorage.getItem(LANG_KEY) || 'ja';

const I18N = {
  ja: {
    'page.title': 'データ引継ぎ - Sky所持率管理',
    'tools.item': '🗂️ アイテム所持管理',
    'tools.emote': '🎭 エモート所持率管理',
    'tools.share': '📍 創作物管理ツール',
    'tools.taiNomacan': '🕯️ ノマキャン計算機',
    'tools.starCandle': '🕯️ 星のキャンドル計算機',
    'tools.companion': '✨ 精霊同行ツール',
    'tools.wings': '🪽 羽トラッカー',
    'tools.dataTransfer': '🔄 データ引継ぎ',
    'sidebar.hamburgerToggle': '☰ ツール',
    'sidebar.relatedToolsLabel': '🔗 関連ツール',
    'dock.ariaLabel': 'クイックメニュー',
    'dock.export': 'エクスポート',
    'dock.import': 'インポート',
    'dock.otherTools': '他のツール',
    'dock.settings': '表示設定',
    'page.sectionExport': '📤 引き継ぎコードを作成',

function t(key, vars) {
  const dict = I18N[LANG] || I18N.ja;
  let str = dict[key] !== undefined ? dict[key] : (I18N.ja[key] !== undefined ? I18N.ja[key] : key);
  if (vars) {
    Object.keys(vars).forEach(k => { str = str.split('{' + k + '}').join(vars[k]); });
  }
  return str;
}

function applyI18n() {
  document.documentElement.lang = LANG;
  document.title = t('page.title');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    el.title = t(el.getAttribute('data-i18n-title'));
  });
  document.querySelectorAll('[data-i18n-aria-label]').forEach(el => {
    el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria-label')));
  });
  const langBtn = document.getElementById('langToggleBtn');
  if (langBtn) langBtn.textContent = LANG === 'ja' ? 'EN' : '日本語';
}

function toggleLang() {
  setLang(LANG === 'ja' ? 'en' : 'ja');
}

// ⚙️ 表示設定モーダルの言語セレクター（🌐 言語 / Language）用：トグルと違い、押した言語へ
// 直接切り替える。既に選択中の言語を押した場合は何もしない安全なノーオペとする
// （無駄な再描画やlocalStorage書き込みを避ける。UXの要件として明示されている）。
function setLang(lang) {
  if (lang !== 'ja' && lang !== 'en') return;
  if (lang === LANG) return;
  LANG = lang;
  localStorage.setItem(LANG_KEY, LANG);
  applyI18n();
  applyThemeToDOM(); // ダーク/ライト切替ボタンのラベル文言も、言語切替時に更新する
  renderExportSiteList();
  renderExportOutput();
  renderImportSiteArea();
  syncSettingsLangButtons();
}

/* ================================================================
   ⚙️ 表示設定（ダークモード・キーボードショートカット）
   sky_app_theme / sky_shortcuts_enabled は taipak5000.github.io 系
   ツール共通のプレーンなグローバルキー（プロフィールごとの nsKey() 対象外。
   sky_app_lang と同じ扱い）。
   ================================================================ */
const THEME_KEY = 'sky_app_theme';
const SHORTCUTS_KEY = 'sky_shortcuts_enabled';
// <head>の同期スクリプトが既に data-theme 属性を設定済みなので、その値を初期状態として読む
let isDarkMode = document.documentElement.getAttribute('data-theme') === 'dark';

function applyThemeToDOM() {
  document.documentElement.setAttribute('data-theme', isDarkMode ? 'dark' : 'light');
  const btn = document.getElementById('settingsThemeBtn');
  if (btn) btn.textContent = t(isDarkMode ? 'settings.themeDark' : 'settings.themeLight');
}

function toggleTheme() {
  isDarkMode = !isDarkMode;
  applyThemeToDOM();
  try {
    localStorage.setItem(THEME_KEY, isDarkMode ? 'dark' : 'light');
  } catch (e) { /* プライベートブラウジング等でlocalStorageが使えない場合も表示は継続する */ }
}

// ⌨️ キーボードショートカット（?・d・Esc）が有効かどうかを、その都度localStorageから
// 直接判定するヘルパー。未設定（null）の場合は有効（true）扱い。
function skyShortcutsEnabled() {
  try {
    const v = localStorage.getItem(SHORTCUTS_KEY);
    return v === null ? true : v === '1';
  } catch (e) { return true; }
}

// 表示設定モーダル内の言語セレクターボタンの選択中ハイライトを、現在の言語(LANG)に同期する
function syncSettingsLangButtons() {
  const jaBtn = document.getElementById('settingsLangJaBtn');
  const enBtn = document.getElementById('settingsLangEnBtn');
  if (jaBtn) jaBtn.classList.toggle('active', LANG === 'ja');
  if (enBtn) enBtn.classList.toggle('active', LANG === 'en');
}

function settingsOpen() {
  const cb = document.getElementById('shortcutsCheckbox');
  if (cb) cb.checked = skyShortcutsEnabled();
  applyThemeToDOM();
  syncSettingsLangButtons();
  document.getElementById('settingsModal').classList.add('show');
}

  document.getElementById('settingsModal').classList.remove('show');

// Escapeで閉じるべき「開いているモーダル」の登録先（このリポジトリには
// 表示設定モーダル以外にモーダルは存在しない）
function closeTopmostOpenModal() {
  const modal = document.getElementById('settingsModal');
  if (modal && modal.classList.contains('show')) { settingsClose(); return; }
}

// ⌨️ 全ツール共通のキーボードショートカット（?＝表示設定を開く／d,D＝ダークモード切替／
// Esc＝開いているモーダルを閉じる）。Escはテキスト入力中でも常に有効（ダイアログを閉じる
// のはユーザーの期待に沿うため）。?とdは、テキスト入力中は通常の文字入力として使えるよう
// ガードする。
document.addEventListener('keydown', function (e) {
  if (e.repeat) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tgt = e.target;
  const isTyping = tgt && (tgt.tagName === 'INPUT' || tgt.tagName === 'TEXTAREA' || tgt.tagName === 'SELECT' || tgt.isContentEditable);

  if (e.key === 'Escape') {
    closeTopmostOpenModal();
    return;
  }

  if (isTyping) return;
  if (!skyShortcutsEnabled()) return;

  if (e.key === '?') { e.preventDefault(); settingsOpen(); return; }
  if (e.key === 'd' || e.key === 'D') { e.preventDefault(); toggleTheme(); return; }
});

function scrollToId(id) {

  const navEl = document.querySelector('nav');

}

/* ================================================================
   コードの圧縮/展開 + Base64（UTF-8セーフ）
   「コードが長すぎる」というフィードバックを受けて、JSON文字列をgzip圧縮
   （CompressionStream、外部ライブラリ不要）してからBase64化し、コードの
   文字数を大幅に短縮している。未対応ブラウザでは無圧縮（U1:）にフォール
   バックする。「:」はBase64に現れない文字なので、旧形式（無印コード）とも
   衝突せず判別できる。
   ================================================================ */
function bytesToBase64(bytes) {
  let binString = '';
  const CHUNK = 8192;
  for (let i = 0; i < bytes.length; i += CHUNK) {
    binString += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  }
  return btoa(binString);
}
function base64ToBytes(b64) {
  const binString = atob(b64);
  const bytes = new Uint8Array(binString.length);
  for (let i = 0; i < binString.length; i++) bytes[i] = binString.charCodeAt(i);
  return bytes;
}
async function encodeTransferCode(str) {
  const bytes = new TextEncoder().encode(str);
  if (typeof CompressionStream === 'undefined') {
    return 'U1:' + bytesToBase64(bytes);
  }
  const cs = new CompressionStream('gzip');
  const writer = cs.writable.getWriter();
  writer.write(bytes);
  writer.close();
  const compressed = new Uint8Array(await new Response(cs.readable).arrayBuffer());
  return 'G1:' + bytesToBase64(compressed);
}
async function decodeTransferCode(code) {
  const marker = code.slice(0, 3);
  const body = code.slice(3);
  if (marker === 'G1:') {
    const ds = new DecompressionStream('gzip');
    const writer = ds.writable.getWriter();
    writer.write(base64ToBytes(body));
    writer.close();
    const bytes = new Uint8Array(await new Response(ds.readable).arrayBuffer());
    return new TextDecoder().decode(bytes);
  }
  if (marker === 'U1:') {
    return new TextDecoder().decode(base64ToBytes(body));
  }
  // 旧形式（圧縮対応前に作成されたコード）: 無印のBase64
  return new TextDecoder().decode(base64ToBytes(code));
}
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

  }).join('');
}

let lastExportCode = null;
let lastExportResult = null; // { selectedIds, keyCount, codeLength, compressRate }
let exportTextareaOpen = false;

async function generateExportCode() {
  const statusEl = document.getElementById('exportStatus');
  const outputEl = document.getElementById('exportOutputArea');
  statusEl.className = 'status-msg';
  statusEl.textContent = t('dyn.creatingCode');
  outputEl.innerHTML = '';
  lastExportCode = null;
  lastExportResult = null;
  exportTextareaOpen = false;

  const allKeys = getAllLocalStorageKeys();
  const selectedIds = [...document.querySelectorAll('#exportSiteList .site-checkbox:checked')].map(el => el.dataset.site);
  if (selectedIds.length === 0) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = t('dyn.selectAtLeastOneSite');
    return;
  }

  const dump = {};
  PROFILE_REGISTRY_KEYS.forEach(k => {
    const v = localStorage.getItem(k);
    if (v !== null) dump[k] = v;
  });
  selectedIds.forEach(id => {
    const site = SITE_CATALOG.find(s => s.id === id);
    matchKeysForSite(site, allKeys).forEach(k => { dump[k] = localStorage.getItem(k); });
  });

  const payload = {
    exportedFrom: 'taipak5000.github.io/tai-transfer/',
    exportedAt: new Date().toISOString(),
    sites: selectedIds,
    data: dump
  };
  const json = JSON.stringify(payload);
  let code, compressRate;
  try {
    const uncompressedLen = bytesToBase64(new TextEncoder().encode(json)).length;
    code = await encodeTransferCode(json);
    compressRate = uncompressedLen > 0 ? Math.max(0, Math.round((1 - code.length / uncompressedLen) * 100)) : 0;
  } catch (e) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = t('dyn.codeGenFailed');
    return;
  }
  lastExportCode = code;
  lastExportResult = { selectedIds, keyCount: Object.keys(dump).length, codeLength: code.length, compressRate };

  renderExportOutput();
  statusEl.className = 'status-msg';
  statusEl.textContent = '';
}

function renderExportOutput() {
  const outputEl = document.getElementById('exportOutputArea');
  if (!lastExportResult) { outputEl.innerHTML = ''; return; }
  const { selectedIds, keyCount, codeLength, compressRate } = lastExportResult;
  const sep = LANG === 'en' ? ', ' : '、';
  const siteLabels = selectedIds.map(id => {
    const site = SITE_CATALOG.find(s => s.id === id);
    return site ? siteLabel(site) : id;
  }).join(sep);
  const compressNote = compressRate > 0 ? t('dyn.compressNote', { rate: compressRate }) : '';
  outputEl.innerHTML = `
    <div class="status-msg">${t('dyn.exportSummary', { sites: escapeHtml(siteLabels), count: keyCount, length: codeLength.toLocaleString(), compressNote })}</div>
    <button type="button" class="action-btn primary" onclick="downloadExportFile()">${t('dyn.downloadBtn')}</button>
    <button type="button" class="action-btn secondary" onclick="toggleExportTextarea()">${t('dyn.showCodeBtn')}</button>
    <div id="exportTextareaArea"></div>
  `;
  renderExportTextareaArea();
}

function toggleExportTextarea() {
  if (!lastExportCode) return;
  exportTextareaOpen = !exportTextareaOpen;
  renderExportTextareaArea();
}

function renderExportTextareaArea() {
  const area = document.getElementById('exportTextareaArea');
  if (!area) return;
  if (!exportTextareaOpen || !lastExportCode) { area.innerHTML = ''; return; }
  area.innerHTML = `
    <textarea id="codeOutput" class="code-textarea" readonly onclick="this.select()">${escapeHtml(lastExportCode)}</textarea>
    <button type="button" class="action-btn secondary" onclick="copyExportCode()">${t('dyn.copyCodeBtn')}</button>
  `;
}

function downloadExportFile() {
  if (!lastExportCode) return;
  const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  const blob = new Blob([lastExportCode], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `sky-tools-transfer_${stamp}.txt`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  const statusEl = document.getElementById('exportStatus');
  statusEl.className = 'status-msg ok';
  statusEl.textContent = t('dyn.downloadSuccess');
}

async function copyExportCode() {
  const ta = document.getElementById('codeOutput');
  if (!ta) return;
  ta.select();
  const statusEl = document.getElementById('exportStatus');
  try {
    await navigator.clipboard.writeText(ta.value);
    statusEl.className = 'status-msg ok';
    statusEl.textContent = t('dyn.copySuccess');
  } catch (e) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = t('dyn.copyFailed');
  }
}

/* ================================================================
   📥 インポート（コード読み込み → サイト選択 → 復元）
   ================================================================ */
let pendingImportData = null;
let lastImportDetected = null; // array of matched SITE_CATALOG entries
let lastImportDataKeys = null;

async function loadCodeForImport() {
  const code = document.getElementById('importCodeInput').value.trim();
  if (!code) return;
  await processImportCode(code);
}

function handleImportFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    const code = String(reader.result).trim();
    document.getElementById('importCodeInput').value = code;
    await processImportCode(code);
  };
  reader.onerror = () => {
    const statusEl = document.getElementById('importStatus');
    statusEl.className = 'status-msg err';
    statusEl.textContent = t('dyn.fileReadFailed');
  };
  reader.readAsText(file);
  event.target.value = '';
}

async function processImportCode(code) {
  const statusEl = document.getElementById('importStatus');
  statusEl.className = 'status-msg';
  statusEl.textContent = '';
  pendingImportData = null;
  lastImportDetected = null;
  lastImportDataKeys = null;
  renderImportSiteArea();

  let payload;
  try {
    payload = JSON.parse(await decodeTransferCode(code));
  } catch (e) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = t('dyn.codeLoadFailed');
    return;
  }
  const data = payload && payload.data && typeof payload.data === 'object' ? payload.data : null;
  if (!data) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = t('dyn.notThisToolCode');
    return;
  }

  pendingImportData = data;
  const dataKeys = Object.keys(data);
  const detected = SITE_CATALOG.filter(site => matchKeysForSite(site, dataKeys).length > 0);
  if (detected.length === 0) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = t('dyn.noMatchingSiteData');
    return;
  }

  lastImportDetected = detected;
  lastImportDataKeys = dataKeys;
  renderImportSiteArea();
}

function renderImportSiteArea() {
  const siteAreaEl = document.getElementById('importSiteArea');
  const confirmAreaEl = document.getElementById('importConfirmArea');
  if (!lastImportDetected || !lastImportDataKeys) {
    siteAreaEl.innerHTML = '';
    confirmAreaEl.innerHTML = '';
    return;
  }
  siteAreaEl.innerHTML = `<div class="status-msg" style="margin-bottom:6px;">${t('dyn.selectSitesToRestore')}</div>` +
    lastImportDetected.map(site => {
      const matched = matchKeysForSite(site, lastImportDataKeys);
      return `
        <label class="site-opt">
          <input type="checkbox" class="import-site-checkbox" data-site="${site.id}" checked>
          <span class="site-opt-label">${escapeHtml(siteLabel(site))}</span>
          <span class="site-opt-count">${t('dyn.keysCount', { n: matched.length })}</span>
        </label>`;
    }).join('');
  confirmAreaEl.innerHTML = `<button type="button" class="action-btn primary" onclick="confirmImport()">${t('dyn.restoreBtn')}</button>`;
}

function confirmImport() {
  if (!pendingImportData) return;
  const statusEl = document.getElementById('importStatus');
  const dataKeys = Object.keys(pendingImportData);
  const selectedIds = [...document.querySelectorAll('#importSiteArea .import-site-checkbox:checked')].map(el => el.dataset.site);
  if (selectedIds.length === 0) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = t('dyn.selectAtLeastOneSite');
    return;
  }

  let count = 0;
  PROFILE_REGISTRY_KEYS.forEach(k => {
    if (pendingImportData[k] !== undefined) { localStorage.setItem(k, pendingImportData[k]); count++; }
  });
  selectedIds.forEach(id => {
    const site = SITE_CATALOG.find(s => s.id === id);
    matchKeysForSite(site, dataKeys).forEach(k => { localStorage.setItem(k, pendingImportData[k]); count++; });
  });

  statusEl.className = 'status-msg ok';
  statusEl.textContent = t('dyn.restoreSuccess', { n: count });
  pendingImportData = null;
  lastImportDetected = null;
  lastImportDataKeys = null;
  document.getElementById('importSiteArea').innerHTML = '';
  document.getElementById('importConfirmArea').innerHTML = '';
  document.getElementById('importCodeInput').value = '';
}

/* ================================================================
   初期化
   ================================================================ */
applyI18n();
applyThemeToDOM();
renderExportSiteList();
</script>
