<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    /* 🌙 ダーク/ライト表示の初期反映（Vue等の描画前に同期実行し、意図しない
       配色でのちらつき「FOUC」を防止する）。sky_app_theme は taipak5000.github.io
       系ツール共通のプレーンなグローバルキー（sky_app_lang と同じ扱い）で、
       'light' / 'dark' / 'system'（未設定＝'system'扱い）の3状態を持つ。
       このスクリプトは他のどのスクリプトより先に単独で実行される必要があるため、
       下方の resolveEffectiveTheme() と同じ解決ロジックをここに複製している
       （ロジックを変更する場合は両方を同期させること）。 */
    (function () {
      try {
        var saved = localStorage.getItem('sky_app_theme');
        var isDark = (saved === 'light' || saved === 'dark')
          ? (saved === 'dark')
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/app-icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="データ引継ぎ">
  <meta name="theme-color" content="#AF52DE">
  <title>データ引継ぎ - Sky所持率管理</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #F2F2F7;
      --card:      #FFFFFF;
      --sep:       rgba(60,60,67,0.12);
      --purple:    #AF52DE;
      --purple-d:  #8E3FB8;
      --purple-bg: rgba(175,82,222,0.10);
      --blue:      #007AFF;
      --green:     #34C759;
      --red:       #FF3B30;
      --text:      #1C1C1E;
      --text-2:    #6C6C71;
      --text-3:    #636366;
      --r:         16px;
      --r-sm:      10px;
    }

    /* 🌙 ダークモード用のカラー上書き（:root と同等の詳細度なので、ソース順で
       後に書くことで上書きされる）。アクセントの色相はライト版から変えず、
       --purple-d と --purple-bg のみ、暗い背景でも読みやすいよう調整している。 */
    [data-theme="dark"] {
      --bg:        #000000;
      --card:      #1C1C1E;
      --sep:       rgba(255,255,255,0.14);
      --purple-d:  #C77DFF;
      --purple-bg: rgba(175,82,222,0.22);
      --text:      #F2F2F7;
      --text-2:    #98989D;
      --text-3:    #86868B;
    }
    [data-theme="dark"] nav { background: rgba(0,0,0,0.75); }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    a { text-decoration:none; color:inherit; -webkit-tap-highlight-color:transparent; }
    button { cursor:pointer; border:none; background:none; font-family:inherit; }
    input, select, textarea { font-family:inherit; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      /* 画面下部固定のsite-dock(クイックメニュー)にコンテンツ末尾が隠れないための余白 */
      padding-bottom: calc(76px + env(safe-area-inset-bottom));
    }

    nav {
      position: sticky; top: 0; z-index: 20;
      background: rgba(242,242,247,0.88); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 0.5px solid var(--sep); padding: 14px 20px 12px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-title { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
    .nav-actions { display: flex; align-items: center; gap: 8px; }
    .sidebar-toggle-btn, .lang-toggle-btn, .settings-toggle-btn {
      background: var(--card); border: 1px solid var(--sep); border-radius: var(--r-sm);
      padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--text);
      display: flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    @media (min-width: 850px) { .sidebar-toggle-btn { visibility: hidden; } }

    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 499; }
    .sidebar-overlay.show { display: block; }

    .app-layout { max-width: 720px; margin: 0 auto; padding: 0 16px; }
    @media (min-width: 850px) { .app-layout { max-width: 960px; display: flex; gap: 20px; align-items: flex-start; } }
    .wrap { flex: 1; min-width: 0; }

    .sidebar {
      width: 200px; flex-shrink: 0; position: sticky; top: 58px;
      background: var(--card); border-radius: var(--r); padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07); display: none; margin-top: 22px;
    }
    @media (min-width: 850px) { .sidebar { display: block; } }
    .sidebar.sidebar-open {
      display: flex !important; flex-direction: column; position: fixed; top: 0; left: 0;
      height: 100%; width: 240px; z-index: 500; overflow-y: auto; margin-top: 0;
      border-radius: 0 12px 12px 0; box-shadow: 4px 0 24px rgba(0,0,0,0.2);
    }
    .sidebar-close-btn {
      background: none; border: none; font-size: 22px; cursor: pointer;
      color: var(--text-2); padding: 0; line-height: 1; flex-shrink: 0; display: none;
    }
    .sidebar.sidebar-open .sidebar-close-btn { display: block; }
    .sidebar-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .sidebar-section-label { font-size: 11px; font-weight: 700; color: var(--text-2); text-transform: uppercase; }
    .sidebar-nav-link {
      display: flex; align-items: center; gap: 9px; padding: 9px 12px; border-radius: var(--r-sm);
      color: var(--text); font-size: 13.5px; font-weight: 500; margin-bottom: 2px;
      width: 100%; box-sizing: border-box; white-space: nowrap;
    }
    .sidebar-nav-link:hover { background: var(--bg); }
    .sidebar-nav-link.current-tool { background: var(--purple-bg); color: var(--purple-d); font-weight: 700; }

    .sec-label { font-size: 13px; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.4px; padding: 22px 4px 10px; }
    .card { background: var(--card); border-radius: var(--r); padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
    .hint { font-size: 12.5px; color: var(--text-2); line-height: 1.7; margin-bottom: 14px; }

    .site-opt {
      display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 0.5px solid var(--sep);
      cursor: pointer;
    }
    .site-opt:last-of-type { border-bottom: none; }
    .site-opt input[type="checkbox"] { width: 18px; height: 18px; flex-shrink: 0; accent-color: var(--purple); }
    .site-opt-label { flex: 1; font-size: 14px; color: var(--text); }
    .site-opt-count { font-size: 12px; color: var(--text-2); }
    /* ♿ データが無いサイトの行は、以前は行全体をopacity:0.45で薄くしていたが、
       ライト/ダーク両テーマでWCAG AAのコントラスト比(通常文字4.5:1)を割り込んでいた
       （チェックボックス自体はdisabledにしておらず、視覚的に薄いだけの表現のため）。
       透過ではなく、既にAA基準を満たす--text-2トークン（カード背景に対し light 5.7:1
       ／dark 5.9:1）へラベル文字色を差し替えることで、読みやすさを保ったまま
       「データ無し」を伝える。 */
    .site-opt.no-data .site-opt-label { color: var(--text-2); }

    /* ✅ 各サイト選択リスト共通の「全選択／全解除」行（wingsの.area-btnに倣った
       ピル型の小さいテキストボタン）。エクスポート側は静的HTML、インポート側は
       復元候補サイトが判明してから動的に描画される。 */
    .list-select-row { display: flex; justify-content: flex-end; gap: 6px; margin-bottom: 8px; }
    .list-select-btn {
      font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
      background: var(--bg); color: var(--text-2); border: 1px solid var(--sep); white-space: nowrap;
    }

    .action-btn {
      display: block; width: 100%; padding: 12px; border-radius: var(--r-sm); font-size: 14.5px; font-weight: 700;
      text-align: center; cursor: pointer; margin-top: 12px; box-sizing: border-box;
    }
    .action-btn.primary { background: var(--purple); color: #fff; }
    .action-btn.secondary { background: var(--bg); color: var(--text); border: 1px solid var(--sep); }

    .code-textarea {
      width: 100%; box-sizing: border-box; border: 1px solid var(--sep); border-radius: var(--r-sm);
      padding: 10px 12px; font-size: 11px; font-family: monospace; color: var(--text);
      resize: vertical; min-height: 110px; background: var(--bg); outline: none; margin-top: 10px;
    }
    .code-textarea:focus { border-color: var(--purple); }
    input[type="file"] {
      width: 100%; box-sizing: border-box; font-size: 12.5px; color: var(--text-2);
      border: 1px dashed var(--sep); border-radius: var(--r-sm); padding: 10px 12px; margin-top: 10px;
    }
    .status-msg { font-size: 12.5px; color: var(--text-2); margin-top: 10px; line-height: 1.6; }
    .status-msg.ok { color: var(--green); }
    .status-msg.err { color: var(--red); }

    /* 🕒 エクスポートカード上部の「最終バックアップ」リマインダー。エクスポートを
       実行しなくても常時見える、持続的なステータス行（.hintの直後・操作ボタンより
       前に置き、バックアップ状況を選択リストより先に目に入るようにする）。
       一度もバックアップが無い場合(.never)は警告色ではなく--purpleで「まだ危険」
       ではなく「やってみよう」という前向きなトーンにする。 */
    .last-export-reminder {
      display: flex; align-items: center; gap: 7px;
      background: var(--bg); border: 1px solid var(--sep); border-radius: var(--r-sm);
      padding: 8px 12px; margin-bottom: 14px; font-size: 12.5px; color: var(--text-2); line-height: 1.6;
    }
    .last-export-reminder.never { border-color: var(--purple); color: var(--purple-d); }

    /* 🕒 エクスポート結果／インポート確認画面の「サイト別 最終更新」内訳リスト */
    .site-updated-list { margin-top: 8px; }
    .site-updated-row {
      display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
      font-size: 12px; color: var(--text-2); padding: 3px 0;
    }
    .site-updated-row .site-updated-name { flex: 1; min-width: 0; }
    .site-updated-row .site-updated-date { flex-shrink: 0; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .site-updated-row.overwrite .site-updated-date { color: var(--red); font-weight: 700; }

    /* ⚠️ インポート前の上書き確認（既にローカルにデータがあるサイトを検知した場合の
       2段階確認）。既存の.status-msg等と同じトークンを再利用し、新規カラーは追加しない。 */
    .import-warning-box {
      background: var(--bg); border: 1px solid var(--purple); border-radius: var(--r-sm);
      padding: 10px 12px; margin-bottom: 8px; font-size: 12.5px; color: var(--text); line-height: 1.7;
    }
    .import-overwrite-confirm {
      background: var(--bg); border: 1px solid var(--red); border-radius: var(--r-sm);
      padding: 10px 12px; margin-top: 8px; font-size: 12.5px; color: var(--text); line-height: 1.7;
    }
    /* ♿ ボタン背景の白文字は共通トークン--red(#FF3B30)のままだとコントラスト比
       約3.55:1でWCAG AAの通常文字基準(4.5:1)を満たさない。--redはstatus-msg.err等
       「文字色」としての用途で使う分には既存踏襲だが、ボタン背景として白文字を
       乗せる新規パターンはここが初出のため、この用途に限りボタン背景だけ
       ワントーン濃い赤(#D70015・白文字で約5.38:1、AA適合)を使う。--redトークン
       自体は他の既存箇所に影響するため変更しない。 */
    .import-overwrite-confirm .action-btn.danger { background: #D70015; color: #fff; }

    /* 📱 QRコード表示パネル。スキャン用途のため、ダークモードでも背景は
       意図的に固定の白（テーマトークンを使わない）にしている。QRコードは
       「白地に黒」でないと読み取り精度が落ちるため、これはテーマ非対応の
       意図的な例外。 */
    .qr-panel { text-align: center; margin-top: 10px; }
    .qr-box {
      display: inline-block; background: #fff; padding: 12px; border-radius: var(--r-sm);
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }
    .qr-box svg { display: block; width: 200px; height: 200px; max-width: 100%; }

    footer { text-align: center; font-size: 11.5px; color: var(--text-3); padding: 34px 16px 12px; line-height: 1.9; }
    footer a { color: var(--purple-d); text-decoration: none; }

    /* ⚙️ 表示設定モーダル（ダークモード切替・キーボードショートカット設定） */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 600;
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal-card {
      width: 100%; max-width: 360px; max-height: 80vh; overflow-y: auto;
      background: var(--card); border-radius: var(--r); padding: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3); box-sizing: border-box;
    }
    .modal-card h3 {
      margin: 0 0 14px; font-size: 16px; font-weight: 700; color: var(--text);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .modal-close-x { background: none; border: none; font-size: 20px; color: var(--text-2); cursor: pointer; line-height: 1; padding: 0; }
    .settings-section { margin-top: 16px; }
    .settings-section:first-of-type { margin-top: 0; }
    .settings-section-label {
      font-size: 12px; font-weight: 700; color: var(--text-2); text-transform: uppercase;
      letter-spacing: 0.4px; margin: 0 0 8px;
    }
    .settings-row {
      display: flex; align-items: center; gap: 8px; padding: 9px 11px; background: var(--bg);
      border-radius: var(--r-sm); margin-bottom: 6px; font-size: 13.5px; color: var(--text);
    }
    .settings-row:last-child { margin-bottom: 0; }
    .settings-row-text { flex: 1; min-width: 0; }
    .theme-toggle-btn {
      background: var(--card); border: 1px solid var(--sep); color: var(--text);
      padding: 6px 12px; font-size: 12px; border-radius: 20px; cursor: pointer; font-weight: 700; white-space: nowrap;
    }
    /* 🌐 表示設定モーダル内の言語セレクター（1言語=1ボタン。トグルではなく選択式）。
       選択中の言語は.sidebar-nav-link.current-toolと同じpurpleアクセント配色で強調する。 */
    .lang-select-row { display: flex; gap: 8px; }
    .lang-select-btn {
      flex: 1; background: var(--card); border: 1px solid var(--sep); color: var(--text);
      padding: 8px 10px; font-size: 13px; border-radius: var(--r-sm); cursor: pointer;
      font-weight: 600; text-align: center;
    }
    .lang-select-btn.active { background: var(--purple-bg); border-color: var(--purple); color: var(--purple-d); font-weight: 700; }
    .settings-key {
      flex-shrink: 0; min-width: 30px; text-align: center; font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px;
      background: var(--card); border: 1px solid var(--sep); border-radius: 5px; padding: 2px 6px; color: var(--text);
    }
    .settings-close-btn {
      display: block; width: 100%; margin-top: 16px; background: var(--bg); border: 1px solid var(--sep);
      color: var(--text); border-radius: var(--r-sm); padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
    }

    /* 🧭 サイトドック（画面下部固定のクイックアクセスバー）：既存のハンバーガー
       サイドバーとは別系統で並存する、常時表示のショートカット行。pengram.jp系
       サイトに倣ったUIパターンで、companion/emote/share/star-candleに導入済み。
       選択中タブの概念はなく（pengram本体にも無し）、:activeの押下フィードバックのみ。
       このnavは上部の`nav`用セレクタ（position:sticky/border-bottom等）にもマッチして
       しまうため、position/top/border-bottom を明示的に上書きする（top:autoが特に必須。
       指定しないと上部navのtop:0が漏れて画面全体を覆う要素になってしまう）。 */
    .site-dock {
      display: flex; position: fixed; top: auto; left: 0; right: 0; bottom: 0; z-index: 90;
      padding: 6px 10px calc(8px + env(safe-area-inset-bottom));
      background: var(--card); border-bottom: none;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-top: 0.5px solid var(--sep);
      justify-content: space-around; align-items: stretch; gap: 4px;
    }
    /* 上部nav用ダークモード背景上書き（[data-theme="dark"] nav）の方が詳細度が高く
       この要素にも波及するため、専用セレクタで明示的に上書きする */
    [data-theme="dark"] .site-dock { background: var(--card); }
    .site-dock button {
      flex: 1 1 0; max-width: 110px; border: 0; background: none; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 6px 0; min-height: 52px; border-radius: 12px; font-family: inherit;
    }
    .site-dock button:active { background: var(--sep); }
    .site-dock .site-dock-icon { font-size: 20px; line-height: 1; }
    .site-dock .site-dock-label { font-size: 10px; font-weight: 700; color: var(--text-2); }
  </style>
</head>
<body>

<nav>
  <div class="nav-title" data-i18n="tools.dataTransfer"></div>
  <div class="nav-actions">
    <button class="lang-toggle-btn" id="langToggleBtn" onclick="toggleLang()">EN</button>
    <button class="settings-toggle-btn" onclick="settingsOpen()" data-i18n-title="settings.entryBtnTitle">⚙️</button>
    <button class="sidebar-toggle-btn" onclick="toggleSidebar()" data-i18n="sidebar.hamburgerToggle"></button>
  </div>
</nav>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="sidebar-section-label" data-i18n="sidebar.relatedToolsLabel"></div>
      <button class="sidebar-close-btn" onclick="toggleSidebar()">✕</button>
    </div>
    <a href="https://taipak5000.github.io/tai-item/" class="sidebar-nav-link" data-i18n="tools.item"></a>
    <a href="https://taipak5000.github.io/tai-emote/" class="sidebar-nav-link" data-i18n="tools.emote"></a>
    <a href="https://taipak5000.github.io/share/" class="sidebar-nav-link" data-i18n="tools.share"></a>
    <a href="https://taipak5000.github.io/tai-nomacan/" class="sidebar-nav-link" data-i18n="tools.taiNomacan"></a>
    <a href="https://taipak5000.github.io/star-candle/" class="sidebar-nav-link" data-i18n="tools.starCandle"></a>
    <a href="https://taipak5000.github.io/companion/" class="sidebar-nav-link" data-i18n="tools.companion"></a>
    <a href="https://taipak5000.github.io/wings/" class="sidebar-nav-link" data-i18n="tools.wings"></a>
    <a href="https://taipak5000.github.io/tai-transfer/" class="sidebar-nav-link current-tool" data-i18n="tools.dataTransfer"></a>
  </aside>

  <div class="wrap">
    <p class="sec-label" id="exportSection" data-i18n="page.sectionExport"></p>
    <div class="card">
      <div class="hint" data-i18n="page.exportHint"></div>
      <div id="lastExportReminder" class="last-export-reminder"></div>
      <div class="list-select-row">
        <button type="button" class="list-select-btn" onclick="setAllSiteCheckboxes('#exportSiteList .site-checkbox', true)" data-i18n="page.selectAllBtn"></button>
        <button type="button" class="list-select-btn" onclick="setAllSiteCheckboxes('#exportSiteList .site-checkbox', false)" data-i18n="page.selectNoneBtn"></button>
      </div>
      <div id="exportSiteList"></div>
      <button type="button" class="action-btn primary" onclick="generateExportCode()" data-i18n="page.createCodeBtn"></button>
      <div id="exportOutputArea"></div>
      <div id="exportStatus" class="status-msg"></div>
    </div>

    <p class="sec-label" id="importSection" data-i18n="page.sectionImport"></p>
    <div class="card">
      <div class="hint" data-i18n="page.importHint"></div>
      <input type="file" id="importFileInput" accept=".txt,.json" onchange="handleImportFile(event)">
      <div class="hint" style="margin:10px 0 6px;" data-i18n="page.pasteHint"></div>
      <textarea id="importCodeInput" class="code-textarea" placeholder="ここに引き継ぎコードを貼り付け" data-i18n-placeholder="page.pastePlaceholder"></textarea>
      <button type="button" class="action-btn secondary" onclick="loadCodeForImport()" data-i18n="page.loadCodeBtn"></button>
      <div id="importSiteArea"></div>
      <div id="importConfirmArea"></div>
      <div id="importStatus" class="status-msg"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="settingsModal" onclick="if (event.target === this) settingsClose();">

function t(key, vars) {
  const dict = I18N[LANG] || I18N.ja;
  let entry = dict[key] !== undefined ? dict[key] : (I18N.ja[key] !== undefined ? I18N.ja[key] : key);
  // 英語の単数/複数（"1 key" vs "2 keys"）のように、変数の値によって文言そのものが
  // 変わるものは、辞書の値を文字列ではなく関数（vars => string）として定義できる
  // ようにする（日本語は数による語形変化が無いため、文字列のままでよい）。
  let str = typeof entry === 'function' ? entry(vars || {}) : entry;
  if (vars) {
    Object.keys(vars).forEach(k => { str = str.split('{' + k + '}').join(vars[k]); });
  }
  return str;
}

function applyI18n() {
  document.documentElement.lang = LANG;
  document.title = t('page.title');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    el.title = t(el.getAttribute('data-i18n-title'));
  });
  document.querySelectorAll('[data-i18n-aria-label]').forEach(el => {
    el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria-label')));
  });
  const langBtn = document.getElementById('langToggleBtn');
  if (langBtn) langBtn.textContent = LANG === 'ja' ? 'EN' : '日本語';
}

function toggleLang() {
  setLang(LANG === 'ja' ? 'en' : 'ja');
}

// ⚙️ 表示設定モーダルの言語セレクター（🌐 言語 / Language）用：トグルと違い、押した言語へ
// 直接切り替える。既に選択中の言語を押した場合は何もしない安全なノーオペとする
// （無駄な再描画やlocalStorage書き込みを避ける。UXの要件として明示されている）。
function setLang(lang) {
  if (lang !== 'ja' && lang !== 'en') return;
  if (lang === LANG) return;
  LANG = lang;
  localStorage.setItem(LANG_KEY, LANG);
  applyI18n();
  applyThemeToDOM(); // ダーク/ライト切替ボタンのラベル文言も、言語切替時に更新する
  renderExportSiteList();
  renderExportOutput();
  renderImportSiteArea();
  renderLastExportReminder(); // 「最終バックアップ」リマインダーの文言も、言語切替時に更新する
  syncSettingsLangButtons();
}

/* ================================================================
   ⚙️ 表示設定（ダークモード・キーボードショートカット）
   sky_app_theme / sky_shortcuts_enabled は taipak5000.github.io 系
   ツール共通のプレーンなグローバルキー（プロフィールごとの nsKey() 対象外。
   sky_app_lang と同じ扱い）。sky_app_theme は 'light' / 'dark' / 'system'
   の3値を持ち、未設定（null）は 'system' と同じ扱いとする。
   ================================================================ */
const THEME_KEY = 'sky_app_theme';
const SHORTCUTS_KEY = 'sky_shortcuts_enabled';

// 保存値（'light'|'dark'|'system'|未設定）から、実際に画面へ適用すべき配色
// （'dark'|'light'）を解決する共通ヘルパー。<head>の同期スクリプト・toggleTheme()・
// storage/matchMediaの各イベントリスナーは、すべてこのロジックを経由する
// （<head>側だけは他スクリプトより先に単独実行する必要があるため、同じロジックを複製済み）。
function resolveEffectiveTheme(stored) {
  if (stored === 'light' || stored === 'dark') return stored;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

// <head>の同期スクリプトが既に data-theme 属性（'dark'/'light'に解決済みの値）を
// 設定済みだが、「system」を選択中かどうかはそこからは分からないため、
// 生の保存値を localStorage から読み直して初期状態とする。
let themeMode = (function () {
  try {
    const v = localStorage.getItem(THEME_KEY);
    return (v === 'light' || v === 'dark' || v === 'system') ? v : 'system';
  } catch (e) {
    return 'system';
  }
})();

function themeModeLabelKey(mode) {
  return mode === 'dark' ? 'settings.themeDark' : mode === 'light' ? 'settings.themeLight' : 'settings.themeSystem';
}

function applyThemeToDOM() {
  document.documentElement.setAttribute('data-theme', resolveEffectiveTheme(themeMode));
  const btn = document.getElementById('settingsThemeBtn');
  if (btn) {
    const currentLabel = t(themeModeLabelKey(themeMode));
    btn.textContent = currentLabel;
    // ボタンは light → dark → system → light… の順で循環する単一ボタンのため、
    // aria-pressed（真偽値）は3状態を表現できない。代わりに「現在のモード」と
    // 「押すと次に何に切り替わるか」を aria-label に明示する。
    const nextMode = themeMode === 'light' ? 'dark' : themeMode === 'dark' ? 'system' : 'light';
    const nextLabel = t(themeModeLabelKey(nextMode));
    btn.setAttribute('aria-label', t('settings.themeAriaLabel', { current: currentLabel, next: nextLabel }));
  }
}

// light → dark → system → light … の順で循環する（システムは「OSの配色設定に追従」の意）。
function toggleTheme() {
  themeMode = themeMode === 'light' ? 'dark' : themeMode === 'dark' ? 'system' : 'light';
  applyThemeToDOM();
  try {
    localStorage.setItem(THEME_KEY, themeMode);
  } catch (e) { /* プライベートブラウジング等でlocalStorageが使えない場合も表示は継続する */ }
}

// 🖥️ OS側の配色設定（ライト/ダーク）が開いたタブの最中に変化した場合（例：日没での自動切替）、
// 現在「system」を選択中であれば、リロードなしでその変化にライブ追従する。
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
  if (themeMode === 'system') applyThemeToDOM();
});

// 🔄 sky_app_theme は他のtaipak5000.github.io系ツールとも共有するグローバルキーのため、
// 別タブ／別サイトで変更された場合も、このタブを開いたままライブに反映する。
window.addEventListener('storage', function (e) {
  if (e.key !== THEME_KEY) return;
  const v = e.newValue;
  themeMode = (v === 'light' || v === 'dark' || v === 'system') ? v : 'system';
  applyThemeToDOM();
});

// ⌨️ キーボードショートカット（?・d・Esc）が有効かどうかを、その都度localStorageから
// 直接判定するヘルパー。未設定（null）の場合は有効（true）扱い。
function skyShortcutsEnabled() {
  try {
    const v = localStorage.getItem(SHORTCUTS_KEY);
    return v === null ? true : v === '1';
  } catch (e) { return true; }
}

// 表示設定モーダル内の言語セレクターボタンの選択中ハイライトを、現在の言語(LANG)に同期する
function syncSettingsLangButtons() {
  const jaBtn = document.getElementById('settingsLangJaBtn');
  const enBtn = document.getElementById('settingsLangEnBtn');
  if (jaBtn) jaBtn.classList.toggle('active', LANG === 'ja');
  if (enBtn) enBtn.classList.toggle('active', LANG === 'en');
}

function settingsOpen() {
  const cb = document.getElementById('shortcutsCheckbox');
  if (cb) cb.checked = skyShortcutsEnabled();
  applyThemeToDOM();
  syncSettingsLangButtons();
  document.getElementById('settingsModal').classList.add('show');
}
function settingsClose() {
  document.getElementById('settingsModal').classList.remove('show');
}
function onShortcutsCheckboxChange() {
  const cb = document.getElementById('shortcutsCheckbox');
  try {
    localStorage.setItem(SHORTCUTS_KEY, cb.checked ? '1' : '0');
  } catch (e) { /* プライベートブラウジング等でlocalStorageが使えない場合も表示は継続する */ }
}

// Escapeで閉じるべき「開いているモーダル／オーバーレイ」の登録先。表示設定モーダルに
// 加え、「他のツール」サイドバー・ドロワー（ハンバーガーメニュー）もEscで閉じられる
// ようにする（サイドバーもモーダル同様に画面を覆うオーバーレイのため）。
function closeTopmostOpenModal() {
  const modal = document.getElementById('settingsModal');
  if (modal && modal.classList.contains('show')) { settingsClose(); return; }
  const sidebar = document.getElementById('sidebar');
  if (sidebar && sidebar.classList.contains('sidebar-open')) { toggleSidebar(); return; }
}

// ⌨️ 全ツール共通のキーボードショートカット（?＝表示設定を開く／d,D＝ダークモード切替／
// Esc＝開いているモーダルを閉じる）。Escはテキスト入力中でも常に有効（ダイアログを閉じる
// のはユーザーの期待に沿うため）。?とdは、テキスト入力中は通常の文字入力として使えるよう
// ガードする。
document.addEventListener('keydown', function (e) {
  if (e.repeat) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tgt = e.target;
  const isTyping = tgt && (tgt.tagName === 'INPUT' || tgt.tagName === 'TEXTAREA' || tgt.tagName === 'SELECT' || tgt.isContentEditable);

  if (e.key === 'Escape') {
    closeTopmostOpenModal();
    return;
  }

  if (isTyping) return;
  if (!skyShortcutsEnabled()) return;

  if (e.key === '?') { e.preventDefault(); settingsOpen(); return; }
  if (e.key === 'd' || e.key === 'D') { e.preventDefault(); toggleTheme(); return; }
});

   サイドバー開閉
   ================================================================ */
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('sidebar-open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
}

/* ================================================================
   🧭 サイトドック（画面下部固定のクイックアクセスバー）
   このページはタブ切替のない一本のスクロールなので、エクスポート/インポート
   ボタンは対象セクションへスクロールするだけ（モーダルは無い）。
   ================================================================ */
function scrollToId(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const navEl = document.querySelector('nav');
  const navH = navEl ? navEl.getBoundingClientRect().height : 0;
  const top = el.getBoundingClientRect().top + window.scrollY - navH - 8;
  window.scrollTo({ top, behavior: 'smooth' });
}

// プロフィール（保存枠）そのものの登録情報。どのサイトを選んでも常に一緒に引き継ぐ
// （個別データだけ引き継いでプロフィール一覧が無いと、切り替え表示がおかしくなるため）。
const PROFILE_REGISTRY_KEYS = ['skyProfiles_v1', 'skyActiveProfile_v1'];

// 🔀 プロフィール一覧(skyProfiles_v1)のマージ処理。
// 以前は取り込んだ内容でこの端末の一覧を単純に上書きしていたため、取り込み元に
// 無い（＝この端末だけで作った）プロフィールが一覧から消え、そのデータ本体
// （各サイトの nsKey() 付きキー）はlocalStorageに残ったままUIから操作不能になる、
// という実データロスがあった（bug #1）。id で突き合わせて和集合を取り、両方に
// 同じidが存在する場合はこの端末側の内容を優先する（この端末で最近リネーム／色変更
// した内容が、古い引き継ぎコードの読み込みで意図せず巻き戻るのを防ぐため）。
function previewProfileMerge(importedData) {
  let localList = [];
  try { localList = JSON.parse(localStorage.getItem(PROFILE_REGISTRY_KEYS[0])) || []; } catch (e) { localList = []; }
  if (!Array.isArray(localList)) localList = [];
  let importedList = [];
  const raw = importedData ? importedData[PROFILE_REGISTRY_KEYS[0]] : undefined;
  if (raw !== undefined) {
    try { importedList = JSON.parse(raw) || []; } catch (e) { importedList = []; }
  }
  if (!Array.isArray(importedList)) importedList = [];
  const localIds = new Set(localList.map(p => p && p.id));
  const newProfiles = importedList.filter(p => p && typeof p.id === 'string' && !localIds.has(p.id));
  return { localList, importedList, newProfiles, hasImportedRegistry: raw !== undefined };
}
function applyProfileMerge(importedData) {
  const { localList, newProfiles, hasImportedRegistry } = previewProfileMerge(importedData);
  const mergedList = localList.concat(newProfiles);
  let count = 0;
  if (hasImportedRegistry) {
    localStorage.setItem(PROFILE_REGISTRY_KEYS[0], JSON.stringify(mergedList));
    count++;
  }
  // アクティブなプロフィールのポインタは、この端末で既に選択済みならそれを尊重して
  // 上書きしない（インポートのたびに、勝手にアクティブなプロフィールが切り替わって
  // しまうのを防ぐため）。この端末にまだ無い場合のみ取り込み側の値を採用する
  // （マージ後の一覧に実在するIDである場合に限り、存在しないプロフィールを指さない
  // ようにする）。
  const activeKey = PROFILE_REGISTRY_KEYS[1];
  const importedActive = importedData ? importedData[activeKey] : undefined;
  if (localStorage.getItem(activeKey) === null && importedActive !== undefined && mergedList.some(p => p && p.id === importedActive)) {
    localStorage.setItem(activeKey, importedActive);
    count++;
  }
  return { count, newProfiles };
}
// プロフィールの表示名を組み立てる（profiles.js の pfDisplayName() と同じ規則）。
// isDefaultNameが立っている「メイン」プロフィールは、保存時の言語で翻訳済みの
// 文字列がnameに入っていることがあるため使わず、現在の言語で改めて翻訳する。
function profileDisplayName(p) {
  if (p && p.isDefaultName) return LANG === 'en' ? 'Main' : 'メイン';
  return (p && p.name) || (p && p.id) || '';
}

function getAllLocalStorageKeys() {
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
  return keys;
}
// 🔗 companion（精霊同行ツール）は、共有プロフィール一覧(skyProfiles_v1)を使う独自の
// 複数記録UIを持つが、そのデータ本体キー（dataKeyForRecord()）は通常のnsKey()と違い
// "<key>__" + レコードID をそのまま連結するだけで、区切りのアンダースコアを入れない。
// 共有の仕組みで作成されたプロフィールのIDは通常 "p_"+タイムスタンプ+乱数（profiles.js
// のcreateProfile()参照）だが、companion独自の追加レコードは生成時に区切りアンダースコア
// 無しの "p"+タイムスタンプ+乱数（companion/index.html のgenerateRecordId()参照）を使う
// ため、そのレコードのデータキーは "sky_companion_v4_data__p1a2b3c..." のように、
// 通常の "__p_"（pの直後にもアンダースコア）ではなく "__p"（pの直後は無し）になる。
// この命名ズレでデータが引き継ぎから漏れないよう、末尾のアンダースコアの有無を問わず
// 「__p」で始まっていれば同一サイトのプロフィール／レコード別データとして扱う。
function matchKeysForSite(site, keyPool) {
  return keyPool.filter(k => site.keys.some(prefix =>
    site.namespaced ? (k === prefix || k.startsWith(prefix + '__p')) : (k === prefix)
  ));
}

// ✅ エクスポート／インポート、両方のサイト選択チェックリスト共通の「全選択／全解除」処理
function setAllSiteCheckboxes(selector, checked) {
  document.querySelectorAll(selector).forEach(cb => { cb.checked = checked; });
}

/* ================================================================
   🕒 サイト別「最終更新」タイムスタンプ
   localStorageの値そのものには更新日時が記録されていない（Web標準のAPIには
   キー単位の更新日時を取得する手段が無い）ため、他サイトを一切変更せずに
   このツール側だけで「前回このツールで見た内容と比べて変わったか」を
   検知して積み上げていく方式をとる。サイトごとの現在の中身から軽量な
   署名（ハッシュ）を作り、前回保存した署名と比較して、変わっていれば
   updatedAtを「今」に更新する。導入前からある既存データについては、
   このツールで最初に検知した時点が実質的な開始日時になる（それより前の
   実際の変更日時までは遡れない）。
   ================================================================ */
const SITE_SNAPSHOT_KEY = 'dataTransferSiteSnapshot_v1'; // このツール自身の内部管理用キー（引き継ぎの対象キーには含めない）

// djb2ベースの軽量な非暗号学的ハッシュ。衝突を完全には防げないが、
// 「内容が変わったかどうか」を検知する用途には十分な精度で、かつ元の値を
// 保持するよりずっとコンパクトに保存できる。
function hashString(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) {
    h = ((h << 5) + h + str.charCodeAt(i)) | 0; // h*33 + c
  }
  return (h >>> 0).toString(36);
}
function computeSiteSignature(site, allKeys) {
  const matched = matchKeysForSite(site, allKeys).sort();
  return hashString(matched.map(k => k + '=' + localStorage.getItem(k)).join(''));
}
function loadSiteSnapshots() {
  try {
    const v = JSON.parse(localStorage.getItem(SITE_SNAPSHOT_KEY));
    return (v && typeof v === 'object') ? v : {};
  } catch (e) { return {}; }
}
function saveSiteSnapshots(map) {
  try { localStorage.setItem(SITE_SNAPSHOT_KEY, JSON.stringify(map)); } catch (e) { /* 保存領域上限等は無視して表示だけ継続 */ }
}

// 全サイト（非公開のhidden:trueサイトも含む）の署名を現在のlocalStorageの中身で
// 再計算し、前回と違っていれば（＝新規に検知したデータも含む）updatedAtを今の
// 日時に更新する。データが無くなったサイトは記録を削除する。呼び出すたびに
// 最新のスナップショットmapを返す（保存も行う）。
function refreshSiteSnapshots() {
  const allKeys = getAllLocalStorageKeys();
  const snapshots = loadSiteSnapshots();
  const nowIso = new Date().toISOString();
  let changed = false;
  SITE_CATALOG.forEach(site => {
    const matched = matchKeysForSite(site, allKeys);
    if (matched.length === 0) {
      if (snapshots[site.id]) { delete snapshots[site.id]; changed = true; }
      return;
    }
    const sig = computeSiteSignature(site, allKeys);
    const prev = snapshots[site.id];
    if (!prev || prev.sig !== sig) {
      snapshots[site.id] = { sig, updatedAt: nowIso };
      changed = true;
    }
  });
  if (changed) saveSiteSnapshots(snapshots);
  return snapshots;
}

function siteUpdatedAtLabel(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    return d.toLocaleString(LANG === 'en' ? 'en-US' : 'ja-JP', {
      year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'
    });
  } catch (e) { return ''; }
}

/* ================================================================
   🕒 「最終バックアップ」リマインダー
   エクスポート（引き継ぎコード作成）が成功するたびに、その日時をこの端末だけの
   記録として保存する。上のサイト別スナップショットと違い引き継ぎの対象キーでは
   ないため、他サイトのキーと衝突しない専用プレフィックス（dataTransfer…）を使い、
   SITE_CATALOGのどのsite.keysにもマッチしないことでエクスポート内容から自動的に
   除外される（= この記録自体が引き継がれることはない。端末ごとの実績として扱う）。
   ================================================================ */
const LAST_EXPORT_KEY = 'dataTransferLastExportAt_v1'; // このツール自身の内部管理用キー（引き継ぎの対象キーには含めない）

function getLastExportAt() {
  try { return localStorage.getItem(LAST_EXPORT_KEY); } catch (e) { return null; }
}
function recordLastExportAt() {
  try { localStorage.setItem(LAST_EXPORT_KEY, new Date().toISOString()); } catch (e) { /* 保存領域上限等は無視してエクスポート自体は継続する */ }
}

// 「今日」「1日前」「N日前」の判定は、経過ミリ秒ではなくローカルの暦日の差分で行う
// （例：昨日23:58にバックアップし今日0:02に開いた場合、経過時間は4分でも「1日前」と
// 表示する方が直感に合うため）。
function lastExportDaysAgoLabel(iso) {
  const then = new Date(iso);
  if (isNaN(then.getTime())) return null;
  const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diffDays = Math.round((startOfDay(new Date()) - startOfDay(then)) / 86400000);
  if (diffDays <= 0) return t('dyn.lastExportToday');
  if (diffDays === 1) return t('dyn.lastExportYesterday');
  return t('dyn.lastExportDaysAgo', { n: diffDays });
}

function renderLastExportReminder() {
  const el = document.getElementById('lastExportReminder');
  if (!el) return;
  const iso = getLastExportAt();
  const label = iso ? lastExportDaysAgoLabel(iso) : null;
  if (!label) {
    el.className = 'last-export-reminder never';
    el.textContent = t('dyn.lastExportNever');
    return;
  }
  el.className = 'last-export-reminder';
  el.textContent = label;
}

/* ================================================================
   コードの圧縮/展開 + Base64（UTF-8セーフ）
   「コードが長すぎる」というフィードバックを受けて、JSON文字列をgzip圧縮
   （CompressionStream、外部ライブラリ不要）してからBase64化し、コードの
   文字数を大幅に短縮している。未対応ブラウザでは無圧縮（U1:）にフォール
   バックする。「:」はBase64に現れない文字なので、旧形式（無印コード）とも
   衝突せず判別できる。
   ================================================================ */
function bytesToBase64(bytes) {
  let binString = '';
  const CHUNK = 8192;
  for (let i = 0; i < bytes.length; i += CHUNK) {
    binString += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  }
  return btoa(binString);
}
function base64ToBytes(b64) {
  const binString = atob(b64);
  const bytes = new Uint8Array(binString.length);
  for (let i = 0; i < binString.length; i++) bytes[i] = binString.charCodeAt(i);
  return bytes;
}
async function encodeTransferCode(str) {
  const bytes = new TextEncoder().encode(str);
  if (typeof CompressionStream === 'undefined') {
    return 'U1:' + bytesToBase64(bytes);
  }
  const cs = new CompressionStream('gzip');
  const writer = cs.writable.getWriter();
  // ⚠️ write()/close()の返り値はここでは待たず、後続のarrayBuffer()側の失敗として
  // まとめて拾う設計だが、それでもこの2つのPromiseが拒否されると「拾われなかった
  // Promise」として不要なコンソールエラーになるため、無害な.catch()で握りつぶす
  // （実際のエラー内容はarrayBuffer()側の拒否から取得できるため、ここでは不要）。
  writer.write(bytes).catch(() => {});
  writer.close().catch(() => {});
  const compressed = new Uint8Array(await new Response(cs.readable).arrayBuffer());
  return 'G1:' + bytesToBase64(compressed);
}
async function decodeTransferCode(code) {
  const marker = code.slice(0, 3);
  const body = code.slice(3);
  if (marker === 'G1:') {
    const ds = new DecompressionStream('gzip');
    const writer = ds.writable.getWriter();
    // ⚠️ 壊れた/正しくないコードを読み込んだ場合、write()/close()もarrayBuffer()と
    // 同じ理由で拒否されるが、ここでは待たずに無害な.catch()で握りつぶす（拾われな
    // かったPromiseの拒否として不要なコンソールエラーになるのを防ぐため。ユーザーへの
    // エラー表示は、下のawait arrayBuffer()の拒否を呼び出し元がcatchして行う）。
    writer.write(base64ToBytes(body)).catch(() => {});
    writer.close().catch(() => {});
    const bytes = new Uint8Array(await new Response(ds.readable).arrayBuffer());
    return new TextDecoder().decode(bytes);
  }
  if (marker === 'U1:') {
    return new TextDecoder().decode(base64ToBytes(body));
  }
  // 旧形式（圧縮対応前に作成されたコード）: 無印のBase64
  return new TextDecoder().decode(base64ToBytes(code));
}
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ================================================================
   📤 エクスポート（サイト選択 → コード作成）
   ================================================================ */
function renderExportSiteList() {
  const allKeys = getAllLocalStorageKeys();
  const el = document.getElementById('exportSiteList');
  el.innerHTML = SITE_CATALOG.filter(site => !site.hidden).map(site => {
    const matched = matchKeysForSite(site, allKeys);
    const hasData = matched.length > 0;
    return `
      <label class="site-opt ${hasData ? '' : 'no-data'}">
        <input type="checkbox" class="site-checkbox" data-site="${site.id}" ${hasData ? 'checked' : ''}>
        <span class="site-opt-label">${escapeHtml(siteLabel(site))}</span>
        <span class="site-opt-count">${t('dyn.keysCount', { n: matched.length })}</span>
      </label>`;
  }).join('');
}

let lastExportCode = null;
let lastExportResult = null; // { selectedIds, keyCount, codeLength, compressRate }
let exportTextareaOpen = false;
let exportQrOpen = false;

// 📤 エクスポート出力（ダウンロード/コピー/QR）の状態を破棄し、パネルを空にする。
// 新しくコードを作成する直前と、インポートが完了した直後（インポートで書き込んだ
// データが反映されていない古いコードを誤ってダウンロード/コピー/QR表示させない
// ため）の両方から呼び出す。
function resetExportOutput() {
  lastExportCode = null;
  lastExportResult = null;
  exportTextareaOpen = false;
  exportQrOpen = false;
  const outputEl = document.getElementById('exportOutputArea');
  if (outputEl) outputEl.innerHTML = '';
}

async function generateExportCode() {
  const statusEl = document.getElementById('exportStatus');
  statusEl.className = 'status-msg';
  statusEl.textContent = t('dyn.creatingCode');
  resetExportOutput();

  const allKeys = getAllLocalStorageKeys();
  const selectedIds = [...document.querySelectorAll('#exportSiteList .site-checkbox:checked')].map(el => el.dataset.site);
  // 🌳 hidden:true のサイトはチェックリストに出ないため選択のしようがないが、既存データを
  // 持っていれば下で選択の有無に関わらず常に含めるため、「選択0件」エラーの判定にも
  // それを反映する（confirmImport()側のhasHiddenDataと同じ扱い）。
  const hasHiddenExportData = SITE_CATALOG.filter(s => s.hidden).some(site => matchKeysForSite(site, allKeys).length > 0);
  if (selectedIds.length === 0 && !hasHiddenExportData) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = t('dyn.selectAtLeastOneSite');
    return;
  }

  const dump = {};
  PROFILE_REGISTRY_KEYS.forEach(k => {
    const v = localStorage.getItem(k);
    if (v !== null) dump[k] = v;
  });
  selectedIds.forEach(id => {
    const site = SITE_CATALOG.find(s => s.id === id);
    matchKeysForSite(site, allKeys).forEach(k => { dump[k] = localStorage.getItem(k); });
  });
  // 🌳 hidden:true のサイト（未公開ツール等）はチェックリストに出さないが、既存データを
  // 引き継ぎから静かに落とさないよう、選択の有無に関わらず常に一緒に含める
  // （PROFILE_REGISTRY_KEYSと同じ「選択UIを介さない」扱い）。
  SITE_CATALOG.filter(s => s.hidden).forEach(site => {
    matchKeysForSite(site, allKeys).forEach(k => { dump[k] = localStorage.getItem(k); });
  });

  // 🕒 送り出す時点の最新状態でサイト別スナップショットを更新し、コードに含める全サイト
  // （非公開サイトも含む）の「最終更新」を埋め込む。取り込み側で「このコードの中身は
  // いつ時点のものか」を判断・比較できるようにするため（インポート確認画面・上書き警告用）。
  const snapshotsAtExport = refreshSiteSnapshots();
  const siteUpdatedAt = {};
  selectedIds.concat(SITE_CATALOG.filter(s => s.hidden).map(s => s.id)).forEach(id => {
    if (snapshotsAtExport[id]) siteUpdatedAt[id] = snapshotsAtExport[id].updatedAt;
  });

  const payload = {
    exportedFrom: 'taipak5000.github.io/tai-transfer/',
    exportedAt: new Date().toISOString(),
    sites: selectedIds,
    siteUpdatedAt,
    data: dump
  };
  const json = JSON.stringify(payload);
  let code, compressRate;
  try {
    const uncompressedLen = bytesToBase64(new TextEncoder().encode(json)).length;
    code = await encodeTransferCode(json);
    compressRate = uncompressedLen > 0 ? Math.max(0, Math.round((1 - code.length / uncompressedLen) * 100)) : 0;
  } catch (e) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = t('dyn.codeGenFailed');
    return;
  }
  lastExportCode = code;
  lastExportResult = { selectedIds, keyCount: Object.keys(dump).length, codeLength: code.length, compressRate, siteUpdatedAt };

  // 🕒 引き継ぎコードの作成に成功した時点を「バックアップ完了」として記録する
  // （ダウンロード/コピー/QR表示はコードを取り出す手段の違いに過ぎず、バックアップ
  // そのものはここで完了している）。
  recordLastExportAt();
  renderLastExportReminder();

  renderExportOutput();
  statusEl.className = 'status-msg';
  statusEl.textContent = '';
}

function renderExportOutput() {
  const outputEl = document.getElementById('exportOutputArea');
  if (!lastExportResult) { outputEl.innerHTML = ''; return; }
  const { selectedIds, keyCount, codeLength, compressRate } = lastExportResult;
  const compressNote = compressRate > 0 ? t('dyn.compressNote', { rate: compressRate }) : '';
  // 🌳 選択可能なサイトを1つも選ばず、非公開（hidden）サイトのデータのみが含まれる
  // コードを作成した場合は「選択したサイト: （」のように主語が空になってしまうため、
  // 専用の説明文に差し替える。
  const summary = selectedIds.length === 0
    ? t('dyn.hiddenOnlyExportSummary', { count: keyCount, length: codeLength.toLocaleString(), compressNote })
    : t('dyn.exportSummary', {
        sites: escapeHtml(selectedIds.map(id => {
          const site = SITE_CATALOG.find(s => s.id === id);
          return site ? siteLabel(site) : id;
        }).join(LANG === 'en' ? ', ' : '、')),
        count: keyCount, length: codeLength.toLocaleString(), compressNote
      });
  const qrFeasible = codeLength <= QR_MAX_BYTES;
  // 🕒 選んだサイトごとの「最終更新」一覧（このツールが検知した限りでの最新変更日時）。
  // 古い引き継ぎコードを後から読み込む側が、中身の新しさを判断できるようにするため。
  const updatedRows = selectedIds
    .map(id => {
      const site = SITE_CATALOG.find(s => s.id === id);
      const iso = lastExportResult.siteUpdatedAt && lastExportResult.siteUpdatedAt[id];
      return iso ? `<div class="site-updated-row"><span class="site-updated-name">${escapeHtml(site ? siteLabel(site) : id)}</span><span class="site-updated-date">${escapeHtml(siteUpdatedAtLabel(iso))}</span></div>` : '';
    })
    .filter(Boolean)
    .join('');
  const updatedListHtml = updatedRows
    ? `<div class="status-msg" style="margin-top:10px; margin-bottom:2px;">${t('dyn.siteUpdatedListHeading')}</div><div class="site-updated-list">${updatedRows}</div>`
    : '';
  outputEl.innerHTML = `
    <div class="status-msg">${summary}</div>
    ${updatedListHtml}
    <button type="button" class="action-btn primary" onclick="downloadExportFile()">${t('dyn.downloadBtn')}</button>
    <button type="button" class="action-btn secondary" onclick="toggleExportTextarea()">${t('dyn.showCodeBtn')}</button>
    <div id="exportTextareaArea"></div>
    ${qrFeasible
      ? `<button type="button" class="action-btn secondary" onclick="toggleExportQr()">${t('dyn.showQrBtn')}</button>`
      : `<div class="status-msg">${t('dyn.qrTooLong')}</div>`}
    <div id="exportQrArea"></div>
  `;
  renderExportTextareaArea();
  renderExportQrArea();
}

function toggleExportTextarea() {
  if (!lastExportCode) return;
  exportTextareaOpen = !exportTextareaOpen;
  renderExportTextareaArea();
}

function renderExportTextareaArea() {
  const area = document.getElementById('exportTextareaArea');
  if (!area) return;
  if (!exportTextareaOpen || !lastExportCode) { area.innerHTML = ''; return; }
  area.innerHTML = `
    <textarea id="codeOutput" class="code-textarea" readonly onclick="this.select()">${escapeHtml(lastExportCode)}</textarea>
    <button type="button" class="action-btn secondary" onclick="copyExportCode()">${t('dyn.copyCodeBtn')}</button>
  `;
}

function downloadExportFile() {
  if (!lastExportCode) return;
  const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  const blob = new Blob([lastExportCode], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `sky-tools-transfer_${stamp}.txt`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  const statusEl = document.getElementById('exportStatus');
  statusEl.className = 'status-msg ok';
  statusEl.textContent = t('dyn.downloadSuccess');
}

async function copyExportCode() {
  const ta = document.getElementById('codeOutput');
  if (!ta) return;
  ta.select();
  const statusEl = document.getElementById('exportStatus');
  try {
    await navigator.clipboard.writeText(ta.value);
    statusEl.className = 'status-msg ok';
    statusEl.textContent = t('dyn.copySuccess');
  } catch (e) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = t('dyn.copyFailed');
  }
}

/* ================================================================
   📱 QRコード表示（端末間でAirDropやメッセージアプリを使わず、コードを
   カメラで読み取って渡せるようにする追加パネル）。QRコード生成ライブラリ
   （kazuhikoarase/qrcode-generator, MIT・依存ライブラリなし）は、使う瞬間
   まで読み込まない方式でCDNから動的ロードする（他ツールのhtml2canvas
   遅延ロードと同じパターン）。
   ================================================================ */
// QRコード バージョン40・誤り訂正レベルL におけるバイトモードの最大データ量(バイト)。
// これを超えるコードは、実際の生成を試みるまでもなくQR非対応として扱う。
const QR_MAX_BYTES = 2953;

let qrLibLoading = null;
function ensureQrCodeLib() {
  if (window.qrcode) return Promise.resolve();
  if (qrLibLoading) return qrLibLoading;
  qrLibLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
    s.onload = () => resolve();
    s.onerror = () => { qrLibLoading = null; reject(new Error('qrcode lib load failed')); };
    document.head.appendChild(s);
  });
  return qrLibLoading;
}

function toggleExportQr() {
  if (!lastExportCode) return;
  exportQrOpen = !exportQrOpen;
  renderExportQrArea();
}

async function renderExportQrArea() {
  const area = document.getElementById('exportQrArea');
  if (!area) return;
  if (!exportQrOpen || !lastExportCode) { area.innerHTML = ''; return; }
  const code = lastExportCode; // 読み込み待ちの間にコードが再生成/変更されていないかの確認用
  area.innerHTML = `<div class="status-msg">${t('dyn.qrLoading')}</div>`;
  try {
    await ensureQrCodeLib();
  } catch (e) {
    if (code === lastExportCode && exportQrOpen) area.innerHTML = `<div class="status-msg err">${t('dyn.qrLoadFailed')}</div>`;
    return;
  }
  if (code !== lastExportCode || !exportQrOpen) return; // 読み込み中に閉じられた／別コードに変わった場合は何もしない

  try {
    const qr = qrcode(0, 'L'); // typeNumber:0=自動選択, errorCorrectionLevel:L=最大容量優先
    qr.addData(code);
    qr.make();
    const svg = qr.createSvgTag({ scalable: true });
    area.innerHTML = `
      <div class="qr-panel"><div class="qr-box">${svg}</div></div>
      <div class="status-msg">${t('dyn.qrCaption')}</div>
    `;
    // ♿ ライブラリが生成する<svg>にはアクセシブルネームが無いため、スクリーン
    // リーダー向けにrole="img"・aria-label・<title>を後付けで補う。
    const svgEl = area.querySelector('.qr-box svg');
    if (svgEl) {
      const qrAltText = t('dyn.qrAlt');
      svgEl.setAttribute('role', 'img');
      svgEl.setAttribute('aria-label', qrAltText);
      let titleEl = svgEl.querySelector('title');
      if (!titleEl) {
        titleEl = document.createElementNS('http://www.w3.org/2000/svg', 'title');
        svgEl.insertBefore(titleEl, svgEl.firstChild);
      }
      titleEl.textContent = qrAltText;
    }
  } catch (e) {
    // ライブラリ側の容量超過エラー（QR_MAX_BYTESの見積もりに漏れがあった場合の保険）
    area.innerHTML = `<div class="status-msg err">${t('dyn.qrTooLong')}</div>`;
  }
}

/* ================================================================
   📥 インポート（コード読み込み → サイト選択 → 復元）
   ================================================================ */
let pendingImportData = null;
let pendingImportSiteUpdatedAt = null; // { siteId: ISO日時, ... }（インポート元が生成した「サイト別最終更新」。導入前の古いコードには無い）
let lastImportDetected = null; // array of matched SITE_CATALOG entries
let lastImportDataKeys = null;
let lastImportOverwriteInfo = null; // { visible, hiddenOverwriteCount, newProfiles, hasOverwriteRisk }（renderImportChecklist()で算出）
let importOverwriteConfirming = false; // ⚠️ 上書きが発生する復元の2段階確認state

async function loadCodeForImport() {
  const code = document.getElementById('importCodeInput').value.trim();
  if (!code) return;
  await processImportCode(code);
}

function handleImportFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    const code = String(reader.result).trim();
    document.getElementById('importCodeInput').value = code;
    await processImportCode(code);
  };
  reader.onerror = () => {
    const statusEl = document.getElementById('importStatus');
    statusEl.className = 'status-msg err';
    statusEl.textContent = t('dyn.fileReadFailed');
  };
  reader.readAsText(file);
  event.target.value = '';
}

async function processImportCode(code) {
  const statusEl = document.getElementById('importStatus');
  statusEl.className = 'status-msg';
  statusEl.textContent = '';
  pendingImportData = null;
  pendingImportSiteUpdatedAt = null;
  lastImportDetected = null;
  lastImportDataKeys = null;
  lastImportOverwriteInfo = null;
  importOverwriteConfirming = false;
  renderImportSiteArea();

  let payload;
  try {
    payload = JSON.parse(await decodeTransferCode(code));
  } catch (e) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = t('dyn.codeLoadFailed');
    return;
  }
  const data = payload && payload.data && typeof payload.data === 'object' ? payload.data : null;
  if (!data) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = t('dyn.notThisToolCode');
    return;
  }

  pendingImportData = data;
  // 🕒 コード作成側が埋め込んだ「サイト別最終更新」（機能追加前の古いコードには存在しない）
  pendingImportSiteUpdatedAt = (payload.siteUpdatedAt && typeof payload.siteUpdatedAt === 'object') ? payload.siteUpdatedAt : {};
  const dataKeys = Object.keys(data);
  const detected = SITE_CATALOG.filter(site => matchKeysForSite(site, dataKeys).length > 0);
  if (detected.length === 0) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = t('dyn.noMatchingSiteData');
    return;
  }

  // 🌳 hidden:true のサイトはチェックリストには出さない（未公開ツール等）が、コードに
  // 含まれていれば復元自体はconfirmImport()側で常に行うため、ここでは表示用リストから
  // 除くだけで検出判定自体（上のdetected）には影響させない。
  lastImportDetected = detected.filter(site => !site.hidden);
  lastImportDataKeys = dataKeys;
  renderImportSiteArea();
}

// ⚠️ このインポートで「新しく追加される」のか「既にこの端末にデータがあり上書きされる」
// のかを、サイト単位で判定する（bug #8: 上書き前の警告表示・feature #7: 最終更新の
// 突き合わせで共用）。コード側埋め込みの最終更新（pendingImportSiteUpdatedAt）と、この
// 端末側の最終更新（このツール自身のスナップショット、ここで最新の内容に合わせて
// refreshしておく）を突き合わせ、ローカルの方が新しい場合は特に強調する。
function computeImportOverwriteInfo() {
  const currentLocalKeys = getAllLocalStorageKeys();
  const localSnapshots = refreshSiteSnapshots();
  const visible = (lastImportDetected || []).map(site => {
    const hasLocalData = matchKeysForSite(site, currentLocalKeys).length > 0;
    const localUpdatedAt = (hasLocalData && localSnapshots[site.id]) ? localSnapshots[site.id].updatedAt : null;
    const importUpdatedAt = (pendingImportSiteUpdatedAt && pendingImportSiteUpdatedAt[site.id]) || null;
    return { site, hasLocalData, localUpdatedAt, importUpdatedAt };
  });
  const hiddenOverwriteCount = SITE_CATALOG
    .filter(s => s.hidden && matchKeysForSite(s, lastImportDataKeys || []).length > 0)
    .filter(site => matchKeysForSite(site, currentLocalKeys).length > 0)
    .length;
  const { newProfiles } = previewProfileMerge(pendingImportData || {});
  return {
    visible,
    hiddenOverwriteCount,
    newProfiles,
    hasOverwriteRisk: visible.some(v => v.hasLocalData) || hiddenOverwriteCount > 0
  };
}

// ⚠️ 上書き・新規プロフィール追加の内訳ボックス。警告すべき内容が無ければ空文字を返す。
function renderImportWarningBoxHtml(info) {
  if (!info) return '';
  const overwriteRows = info.visible.filter(v => v.hasLocalData).map(({ site, localUpdatedAt, importUpdatedAt }) => {
    let text = escapeHtml(siteLabel(site));
    if (importUpdatedAt) {
      const openParen = LANG === 'en' ? ' (' : '（';
      const closeParen = LANG === 'en' ? ')' : '）';
      text += `${openParen}${t('dyn.importCodeDateLabel')}: ${escapeHtml(siteUpdatedAtLabel(importUpdatedAt))}`;
      if (localUpdatedAt) {
        text += ` / ${t('dyn.importLocalDateLabel')}: ${escapeHtml(siteUpdatedAtLabel(localUpdatedAt))}`;
        if (localUpdatedAt > importUpdatedAt) text += t('dyn.importLocalNewerFlag');
      }
      text += closeParen;
    }
    return `<div class="site-updated-row overwrite"><span class="site-updated-name">${text}</span></div>`;
  }).join('');

  const parts = [];
  if (overwriteRows) {
    parts.push(`<div>${t('dyn.overwriteSitesLabel')}</div><div class="site-updated-list">${overwriteRows}</div>`);
    if (info.hiddenOverwriteCount > 0) parts.push(`<div>${t('dyn.overwriteHiddenNote', { n: info.hiddenOverwriteCount })}</div>`);
  } else if (info.hiddenOverwriteCount > 0) {
    parts.push(`<div>${t('dyn.overwriteHiddenOnlyLabel', { n: info.hiddenOverwriteCount })}</div>`);
  }
  if (info.newProfiles.length > 0) {
    const names = info.newProfiles.map(p => escapeHtml(profileDisplayName(p))).join(LANG === 'en' ? ', ' : '、');
    parts.push(`<div>${t('dyn.newProfilesLabel', { n: info.newProfiles.length, names })}</div>`);
  }
  if (parts.length === 0) return '';
  return `<div class="import-warning-box">${parts.join('')}</div>`;
}

function renderImportSiteArea() {
  renderImportChecklist();
  renderImportConfirmArea();
}

function renderImportChecklist() {
  const siteAreaEl = document.getElementById('importSiteArea');
  if (!lastImportDetected || !lastImportDataKeys) {
    siteAreaEl.innerHTML = '';
    lastImportOverwriteInfo = null;
    return;
  }

  lastImportOverwriteInfo = computeImportOverwriteInfo();
  const warningHtml = renderImportWarningBoxHtml(lastImportOverwriteInfo);

  if (lastImportDetected.length === 0) {
    // 🌳 コードに含まれるのが非公開（hidden）サイトのデータのみの場合、選べる項目が
    // 無いのに「復元するサイトを選んでください」ヘッダーや、空の0件チェックリスト＋
    // 動作する全選択/全解除ピルを表示するのは不自然。専用の説明文だけを表示する
    // （復元自体はconfirmImport()側でhiddenSitesとして常に行われる）。
    siteAreaEl.innerHTML = warningHtml + `<div class="status-msg" style="margin-bottom:6px;">${t('dyn.hiddenOnlyImportNotice')}</div>`;
    return;
  }

  siteAreaEl.innerHTML = warningHtml +
    `<div class="status-msg" style="margin-bottom:6px;">${t('dyn.selectSitesToRestore')}</div>` +
    `<div class="list-select-row">
      <button type="button" class="list-select-btn" onclick="setAllSiteCheckboxes('#importSiteArea .import-site-checkbox', true)">${t('page.selectAllBtn')}</button>
      <button type="button" class="list-select-btn" onclick="setAllSiteCheckboxes('#importSiteArea .import-site-checkbox', false)">${t('page.selectNoneBtn')}</button>
    </div>` +
    lastImportOverwriteInfo.visible.map(({ site, hasLocalData }) => {
      const matched = matchKeysForSite(site, lastImportDataKeys);
      return `
        <label class="site-opt">
          <input type="checkbox" class="import-site-checkbox" data-site="${site.id}" checked>
          <span class="site-opt-label">${escapeHtml(siteLabel(site))}</span>
          <span class="site-opt-count">${t('dyn.keysCount', { n: matched.length })}${hasLocalData ? ' ⚠️' : ''}</span>
        </label>`;
    }).join('');
}

// ⚠️ 上書きが発生する場合は、確認ボタンの1クリックでは即実行せず、詳細説明＋2回目の
// 明示クリックを要求する2段階確認にする（item/profiles.jsのdmStartWipe/dmConfirmWipe
// と同じ既存パターンに倣う）。上書きが無い（純粋な新規追加のみの）場合は、従来どおり
// 1クリックでそのまま復元する。
// チェックボックスの状態を保持するため、この確認state変更ではimportSiteAreaを
// 再描画しない（renderImportChecklist()は呼ばず、confirmAreaElのみ更新する）。
function renderImportConfirmArea() {
  const confirmAreaEl = document.getElementById('importConfirmArea');
  if (!lastImportDetected || !lastImportDataKeys) {
    confirmAreaEl.innerHTML = '';
    return;
  }
  if (importOverwriteConfirming) {
    confirmAreaEl.innerHTML = `
      <div class="import-overwrite-confirm">
        <div>${t('dyn.importOverwriteConfirmText')}</div>
        <button type="button" class="action-btn danger" onclick="confirmImport()">${t('dyn.importOverwriteConfirmBtn')}</button>
        <button type="button" class="action-btn secondary" onclick="importCancelOverwriteConfirm()">${t('dyn.cancelBtn')}</button>
      </div>`;
    return;
  }
  const hasRisk = !!(lastImportOverwriteInfo && lastImportOverwriteInfo.hasOverwriteRisk);
  confirmAreaEl.innerHTML = `<button type="button" class="action-btn primary" onclick="${hasRisk ? 'importRestoreClicked()' : 'confirmImport()'}">${t('dyn.restoreBtn')}</button>`;
}
function importRestoreClicked() {
  importOverwriteConfirming = true;
  renderImportConfirmArea();
}
function importCancelOverwriteConfirm() {
  importOverwriteConfirming = false;
  renderImportConfirmArea();
}

function confirmImport() {
  if (!pendingImportData) return;
  const statusEl = document.getElementById('importStatus');
  const dataKeys = Object.keys(pendingImportData);
  const selectedIds = [...document.querySelectorAll('#importSiteArea .import-site-checkbox:checked')].map(el => el.dataset.site);
  const hiddenSites = SITE_CATALOG.filter(s => s.hidden);
  const hasHiddenData = hiddenSites.some(site => matchKeysForSite(site, dataKeys).length > 0);
  if (selectedIds.length === 0 && !hasHiddenData) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = t('dyn.selectAtLeastOneSite');
    return;
  }

  let count = 0;
  // 🔀 プロフィール一覧・アクティブポインタは単純上書きせず、既存の登録内容とマージする
  // （bug #1）。
  const { count: registryCount, newProfiles } = applyProfileMerge(pendingImportData);
  count += registryCount;
  selectedIds.forEach(id => {
    const site = SITE_CATALOG.find(s => s.id === id);
    matchKeysForSite(site, dataKeys).forEach(k => { localStorage.setItem(k, pendingImportData[k]); count++; });
  });
  // 🌳 hidden:true のサイトはチェックリストに出ないため選択できないが、コードに含まれて
  // いれば選択の有無に関わらず常に復元する（既存データを静かに落とさないため）。
  hiddenSites.forEach(site => {
    matchKeysForSite(site, dataKeys).forEach(k => { localStorage.setItem(k, pendingImportData[k]); count++; });
  });

  statusEl.className = 'status-msg ok';
  statusEl.textContent = t('dyn.restoreSuccess', { n: count }) + (newProfiles.length > 0
    ? ' ' + t('dyn.restoreSuccessNewProfiles', { n: newProfiles.length, names: newProfiles.map(profileDisplayName).join(LANG === 'en' ? ', ' : '、') })
    : '');
  pendingImportData = null;
  pendingImportSiteUpdatedAt = null;
  lastImportDetected = null;
  lastImportDataKeys = null;
  lastImportOverwriteInfo = null;
  importOverwriteConfirming = false;
  document.getElementById('importSiteArea').innerHTML = '';
  document.getElementById('importConfirmArea').innerHTML = '';
  document.getElementById('importCodeInput').value = '';
  refreshSiteSnapshots(); // 🕒 インポートで書き込んだ内容を、このツールの「最終更新」把握にも反映する
  renderExportSiteList(); // インポートで書き込んだデータを、エクスポート側のチェックリスト/件数へ即反映する
  resetExportOutput(); // インポート前に作成済みだったエクスポートコードは新データを含まず古くなるため破棄する
}

/* ================================================================
   初期化
   ================================================================ */
applyI18n();
applyThemeToDOM();
refreshSiteSnapshots(); // 🕒 このツールの「最終更新」把握を、今この端末にある最新の中身に合わせて更新する
renderExportSiteList();
renderLastExportReminder(); // 🕒 「最終バックアップ」リマインダーを初期表示する
</script>
</body>
</html>
